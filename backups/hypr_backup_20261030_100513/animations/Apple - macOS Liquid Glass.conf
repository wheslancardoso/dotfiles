# /* ---- 💫 Apex macOS Liquid Glass Animations 💫 ---- */
# Transições ultra-fluidas inspiradas no macOS Sonoma / Sequoia
# - Workspaces com slidefade suave (sem corte seco e sem tranco)
# - Janelas abrindo com popin orgânico e amortecimento exponencial
# - Movimento e redimensionamento suaves e elásticos

animations {
    enabled = yes

    # Curvas de física orgânica & desaceleração Apple
    bezier = apple_ease, 0.16, 1, 0.3, 1
    bezier = mac_fluid, 0.25, 1, 0.5, 1
    bezier = soft_decel, 0.05, 0.9, 0.1, 1.02
    bezier = win_pop, 0.05, 0.95, 0.1, 1.05
    bezier = win_close, 0.3, -0.1, 0.1, 1
    bezier = liner, 1, 1, 1, 1

    # Janelas: abertura em popin orgânico e fechamento limpo
    animation = windows, 1, 4.5, soft_decel, popin 75%
    animation = windowsIn, 1, 4.2, win_pop, popin 75%
    animation = windowsOut, 1, 3.2, win_close, popin 80%
    animation = windowsMove, 1, 4.0, apple_ease, slide

    # Bordas e Fade
    animation = border, 1, 1.5, liner
    animation = borderangle, 1, 180, liner, loop
    animation = fade, 1, 3.0, apple_ease
    animation = fadeLayersIn, 1, 2.5, mac_fluid
    animation = fadeLayersOut, 1, 2.0, mac_fluid

    # Camadas flutuantes (Rofi, Notificações, Waybar)
    animation = layersIn, 1, 3.5, apple_ease, slide
    animation = layersOut, 1, 2.5, apple_ease, slide

    # Workspaces: O toque de mestre do Mac (slide + fade suave de 20%)
    # Elimina a sensação de esteira rígida e adiciona profundidade líquida
    animation = workspaces, 1, 4.5, apple_ease, slidefade 20%
    animation = specialWorkspace, 1, 3.8, apple_ease, slidefadevert 25%
}
