# ==============================================================================
# 🔋 TLP - Lenovo ThinkPad Dual Battery & Power Optimization
# Compatível com ThinkPad T480 (BAT0 Interna + BAT1 Externa Removível)
# ==============================================================================

# Limites de Carga de Bateria (Preserva a vida útil e evita inchaço)
# Inicia carga apenas abaixo de 75% e para exatamente em 80%
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80

START_CHARGE_THRESH_BAT1=75
STOP_CHARGE_THRESH_BAT1=80

# Gerenciamento de CPU / Performance x Bateria
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave

CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power

# Perfil de Plataforma (Lenovo ACPI Platform Profile)
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power

# Economia de barramento PCIe e Disco na Bateria
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave
