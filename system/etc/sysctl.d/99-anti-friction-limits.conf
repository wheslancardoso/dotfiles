# ==============================================================================
# 🚀 Limites de Kernel & Antiatrito para Desenvolvimento, Gaming e I/O
# ==============================================================================

# 1. Elimina erro de limite de file watchers em Next.js, Vite, React e Docker
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
fs.file-max = 2097152

# 2. Alocação de memória virtual para jogos modernos (Steam, UE5) e Elasticsearch/Databases
vm.max_map_count = 2147483642

# 3. Responsividade do desktop sob alta carga de memória
vm.swappiness = 10
vm.vfs_cache_pressure = 50

# 4. Controle de congestionamento TCP BBR (menor latência e downloads mais estáveis)
net.core.default_qdisc = fq_codel
net.ipv4.tcp_congestion_control = bbr

# 5. Otimização de I/O de disco e transferências USB (evita congelamento e dá progresso real em pendrives)
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456

