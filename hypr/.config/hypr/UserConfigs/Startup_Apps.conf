# Commands and Apps to be executed at launch

exec-once = copyq

# Inicializar o GNOME Keyring para salvar credenciais
exec-once = gnome-keyring-daemon --start --components=secrets


# Garantir que o Portal e o Keyring tenham acesso às variáveis da sessão
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP GTK_USE_PORTAL GNOME_KEYRING_CONTROL GNOME_KEYRING_PID

# Restaurar o último wallpaper ao iniciar
exec-once = bash -c '[ -f ~/.cache/current_wallpaper ] && awww img $(cat ~/.cache/current_wallpaper)'

# Áudio & Microfone com Supressão de Ruído em segundo plano
exec-once = easyeffects --gapplication-service

# Notificações com Capa de Álbum em Tempo Real (Spotify / MPRIS)
exec-once = $HOME/.config/hypr/UserScripts/MusicNotification.sh

