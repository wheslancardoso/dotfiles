# 🚀 Preset Mestre para Arch-Hyprland & Vibe Coding Master Suite
# Configuração automatizada pré-definida para estações com NVIDIA RTX + Hyprland + Dotfiles Mestre

# AUR Helper preferido
aur_helper="yay"

# Drivers e Hardware NVIDIA
nvidia="ON"
nouveau="ON"
input_group="ON"
rog="OFF"

# Gerenciador de Sessão e Temas SDDM
sddm="ON"
sddm_theme="ON"
gtk_themes="ON"

# Conectividade e Portais Wayland
bluetooth="ON"
thunar="ON"
quickshell="OFF"
xdph="ON"

# Shell e Terminal
zsh="ON"
pokemon="OFF"

# Integração com Dotfiles Mestre do Usuário
dots="ON"
custom_dots="ON"
use_master_dots="true"
USER_DOTFILES_REPO="https://github.com/wheslancardoso/dotfiles.git"

# Execução autônoma (zero prompts desnecessários)
non_interactive="true"
