[manager]
ratio          = [ 1, 4, 3 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = true
show_symlink   = true

[preview]
tab_size        = 2
max_width       = 600
max_height      = 900
cache_dir       = ""
image_filter    = "triangle"
image_quality   = 75
sixel_fraction  = 15
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
open = [
	{ run = 'xdg-open "$@"', desc = "Open" },
]
edit = [
	{ run = '${EDITOR:-vi} "$@"', block = true, desc = "Edit" },
]

[open]
rules = [
	{ name = "*/", use = [ "open", "edit" ] },
	{ mime = "text/*", use = [ "edit", "open" ] },
	{ mime = "image/*", use = [ "open" ] },
	{ mime = "video/*", use = [ "open" ] },
	{ mime = "audio/*", use = [ "open" ] },
	{ mime = "application/pdf", use = [ "open" ] },
]

[flavor]
use = "catppuccin-mocha"
