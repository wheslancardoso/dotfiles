# ==============================================================================
# 🎬 MPV GOD MODE — Configuração de Alta Fidelidade (Arch Linux + Hyprland)
# ==============================================================================
# Pipeline gráfico moderno, áudio estúdio, readahead massivo e imersão linguística.
# ==============================================================================

# --- Renderização Gráfica & GPU (Vibrant Cinema / Zero-Stutter 2.5x) ---
vo=gpu-next
gpu-api=auto
hwdec=auto-safe
profile=gpu-hq
scale=spline36
cscale=spline36
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

# --- Sincronização & Fluidez em Velocidades Altas (1.5x a 3.0x) ---
video-sync=audio
framedrop=vo
hr-seek=default
hr-seek-framedrop=yes

# --- Calibração de Cores e Contraste Estilo Tela de Celular (Vibrant AMOLED) ---
contrast=4
saturation=7
brightness=-1
gamma=0

# --- Debanding Leve & Rápido (Gradientes Suaves sem Gargalo de GPU) ---
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=24
dither-depth=auto
dither=fruit

# --- Tone-Mapping Inteligente HDR -> SDR (Cores Vivas em Monitores Comuns) ---
tone-mapping=bt.2446a

# --- Correção de Pitch e Áudio a 1.25x+ ---
# Garante que vozes aceleradas mantenham afinação natural sem tom de "esquilo"
audio-pitch-correction=yes
audio-channels=stereo
volume=100
volume-max=150

# --- Memória & Comportamento da Janela ---
keep-open=yes
save-position-on-quit=yes
autofit-larger=85%x85%
geometry=50%:50%
cursor-autohide=1000
cursor-autohide-fs-only=no

# --- OSD & UI Integrada (uosc) ---
osc=no
osd-bar=no
border=no
osd-font="Inter SemiBold"
osd-font-size=28
osd-color="#cdd6f4"
osd-border-color="#11111b"
osd-border-size=2

# --- Buffer, Streaming & Readahead Inteligente (Zero-Stutter + Fast Seek) ---
cache=yes
cache-secs=300
demuxer-readahead-secs=120
demuxer-max-bytes=1024M
demuxer-max-back-bytes=256M
demuxer-seekable-cache=yes
force-seekable=yes
cache-pause-wait=1
demuxer-mkv-subtitle-preroll=yes
hls-bitrate=max
network-timeout=30
stream-buffer-size=512KiB
ytdl-format="bestvideo[height<=?1080]+bestaudio/best"

# --- Otimização Exclusiva para Streaming / YouTube / Twitch / Web ---
# Cancela readahead pendente ao pular minutos adiante, buscando keyframe imediato
[protocol.https]
cache=yes
cache-secs=60
demuxer-readahead-secs=60
demuxer-max-bytes=256M
demuxer-max-back-bytes=64M
demuxer-seekable-cache=yes
force-seekable=yes
hr-seek=default
hr-seek-framedrop=yes
stream-buffer-size=256KiB
ytdl-raw-options=force-ipv4=,no-check-certificates=

[protocol.http]
profile=protocol.https

[protocol.ytdl]
profile=protocol.https

# --- Inteligência de Legendas & Fim do Forçado ---
# Desativa obediência cega a trilhas marcadas como "forced" em MKVs
sub-forced-events-only=no
sub-auto=fuzzy
sub-fix-timing=yes
slang=en,eng,enUS,pt,por,ptBR
alang=ja,jp,jpn,en,eng,pt,por

# Estilização Moderna de Legendas (Legibilidade Cinema)
sub-font="Inter Medium"
sub-font-size=40
sub-border-size=2.4
sub-border-color="#000000"
sub-color="#ffffff"
sub-shadow-offset=1.2
sub-shadow-color="0.0/0.0/0.0/0.75"
sub-margin-y=42

# --- Screenshots de Alta Qualidade ---
screenshot-format=png
screenshot-png-compression=7
screenshot-template="%F_snapshot_%wH.%wM.%wS"
screenshot-directory="~/pictures"
