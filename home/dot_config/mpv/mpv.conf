# ==============================================================================
# 🎬 MPV APEX STREAMING & CINEMA — High-Performance Engine (Arch + Hyprland)
# ==============================================================================
# GPU Vulkan Pipeline (NVIDIA RTX 5060), 2GB RAM Cache, Multi-Threaded yt-dlp,
# Auto-Reconnect em Quedas de Rede e Seek Instantâneo (Zero Buffering).
# ==============================================================================

# --- Renderização Gráfica & GPU (NVIDIA RTX 5060 / NVDEC) ---
vo=gpu-next
hwdec=nvdec-copy
profile=gpu-hq
scale=spline36
cscale=spline36
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

# --- Calibração Limpa e Nativa ---
video-sync=display-resample
interpolation=yes
tscale=oversample

# --- Áudio Estúdio & Correção de Pitch a 1.25x+ ---
audio-pitch-correction=yes
audio-channels=stereo
volume=100
volume-max=150

# --- Memória & Comportamento da Janela ---
keep-open=yes
save-position-on-quit=yes
autofit-larger=85%x85%
geometry=50%:50%
cursor-autohide=1000
cursor-autohide-fs-only=no
input-ipc-server=/tmp/mpv-socket

# --- OSD & UI Integrada (uosc) ---
osc=no
osd-bar=no
border=no
osd-font="Inter SemiBold"
osd-font-size=28
osd-color="#cdd6f4"
osd-border-color="#11111b"
osd-border-size=2

# ==============================================================================
# 🚀 MOTOR DE STREAMING & REDE DE ALTA VELOCIDADE (ZERO BUFFERING)
# ==============================================================================
cache=yes
cache-secs=1200
demuxer-readahead-secs=1200
demuxer-max-bytes=2048M
demuxer-max-back-bytes=512M
demuxer-seekable-cache=yes
demuxer-cache-wait=yes
demuxer-mkv-subtitle-preroll=yes
hls-bitrate=max
tls-verify=no
network-timeout=30

# Auto-Reconexão Rápida sem Conflitos de Sintaxe
stream-lavf-o=reconnect=1,reconnect_streamed=1,reconnect_on_network_error=1,reconnect_delay_max=5

# Formato de Vídeo Otimizado (Máximo 1080p 60fps - protocolos HTTP e VP9/H264 estáveis)
ytdl-format="bestvideo[height<=?1080][fps<=?60][vcodec!^=av01][protocol^=http]+bestaudio[protocol^=http]/bestvideo[height<=?1080][fps<=?60]+bestaudio/best"

# yt-dlp Flags limpas (IPv4 forçado para evitar gargalos de rota IPv6)
ytdl-raw-options=no-check-certificates=,force-ipv4=

# ==============================================================================
# 📝 INTELIGÊNCIA DE LEGENDAS & FORMATO CINEMA
# ==============================================================================
sub-forced-events-only=no
sub-auto=fuzzy
sub-fix-timing=yes
slang=en,eng,enUS,pt,por,ptBR
alang=ja,jp,jpn,en,eng,pt,por

sub-font="Inter Medium"
sub-font-size=40
sub-border-size=2.4
sub-border-color="#000000"
sub-color="#ffffff"
sub-shadow-offset=1.2
sub-shadow-color="0.0/0.0/0.0/0.75"
sub-margin-y=42

# --- Screenshots de Alta Qualidade ---
screenshot-format=png
screenshot-png-compression=7
screenshot-template="%F_snapshot_%wH.%wM.%wS"
screenshot-directory="~/pictures"
