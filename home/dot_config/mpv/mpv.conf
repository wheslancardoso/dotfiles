# ==============================================================================
# 🎬 MPV APEX STREAMING & CINEMA — High-Performance Engine (Arch + Hyprland)
# ==============================================================================
# GPU Vulkan Pipeline (NVIDIA RTX 5060), 2GB RAM Cache, Multi-Threaded yt-dlp,
# Auto-Reconnect em Quedas de Rede e Seek Instantâneo (Zero Buffering).
# ==============================================================================

# --- Renderização Gráfica & GPU (NVIDIA RTX 5060 / Vulkan) ---
vo=gpu-next
gpu-api=vulkan
hwdec=auto-safe
profile=gpu-hq
scale=spline36
cscale=spline36
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
vulkan-async-compute=yes
vulkan-async-transfer=yes
vulkan-queue-count=2
swapchain-depth=3

# --- Sincronização, Framerate & Seek Instantâneo ---
video-sync=audio
framedrop=vo
hr-seek=default
hr-seek-framedrop=yes

# --- Calibração de Cores e Contraste Estilo Tela de Celular (Vibrant AMOLED) ---
contrast=4
saturation=7
brightness=-1
gamma=0

# --- Debanding Leve & Rápido (Gradientes Suaves sem Gargalo de GPU) ---
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=24
dither-depth=auto
dither=fruit

# --- Tone-Mapping Inteligente HDR -> SDR (Cores Vivas em Monitores Comuns) ---
tone-mapping=bt.2446a

# --- Áudio Estúdio & Correção de Pitch a 1.25x+ (Scaletempo2) ---
audio-pitch-correction=yes
af=scaletempo2=max-speed=4.0:search-interval=30
audio-channels=stereo
volume=100
volume-max=150

# --- Memória & Comportamento da Janela ---
keep-open=yes
save-position-on-quit=yes
autofit-larger=85%x85%
geometry=50%:50%
cursor-autohide=1000
cursor-autohide-fs-only=no

# --- OSD & UI Integrada (uosc) ---
osc=no
osd-bar=no
border=no
osd-font="Inter SemiBold"
osd-font-size=28
osd-color="#cdd6f4"
osd-border-color="#11111b"
osd-border-size=2

# ==============================================================================
# 🚀 MOTOR DE STREAMING & REDE DE ALTA VELOCIDADE (ZERO BUFFERING)
# ==============================================================================
cache=yes
cache-secs=300
demuxer-readahead-secs=300
demuxer-max-bytes=2048M
demuxer-max-back-bytes=512M
demuxer-seekable-cache=yes
force-seekable=yes
demuxer-hysteresis-secs=10
demuxer-lavf-buffersize=4194304
stream-buffer-size=4096KiB
demuxer-mkv-subtitle-preroll=yes
hls-bitrate=max
network-timeout=15

# Auto-Reconexão Inteligente em Quedas/Lentidão de CDN
stream-lavf-o=reconnect=1,reconnect_streamed=1,reconnect_delay_max=5,reconnect_on_http_error=4xx,5xx,reconnect_on_network_error=1

# Formato de Vídeo Otimizado (Máxima Qualidade 60fps sem sobrecarga inútil de 8K)
ytdl-format="bestvideo[height<=?1080][fps<=?60]+bestaudio/best"

# Multi-Threaded Fragment Downloader (Baixa 8 segmentos simultâneos para carregar na hora)
ytdl-raw-options=concurrent-fragments=8,downloader=m3u8:native,downloader=dash:native,extractor-args=youtube:player_client=android;web,force-ipv4=,no-check-certificates=,buffer-size=16M

# --- Otimização Exclusiva para Protocolos Web (HTTPS / HTTP / YTDL) ---
[protocol.https]
cache=yes
cache-secs=300
demuxer-readahead-secs=300
demuxer-max-bytes=2048M
demuxer-max-back-bytes=512M
demuxer-seekable-cache=yes
force-seekable=yes
hr-seek=default
hr-seek-framedrop=yes
stream-buffer-size=4096KiB
user-agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"

[protocol.http]
profile=protocol.https

[protocol.ytdl]
profile=protocol.https

# ==============================================================================
# 📝 INTELIGÊNCIA DE LEGENDAS & FORMATO CINEMA
# ==============================================================================
sub-forced-events-only=no
sub-auto=fuzzy
sub-fix-timing=yes
slang=en,eng,enUS,pt,por,ptBR
alang=ja,jp,jpn,en,eng,pt,por

sub-font="Inter Medium"
sub-font-size=40
sub-border-size=2.4
sub-border-color="#000000"
sub-color="#ffffff"
sub-shadow-offset=1.2
sub-shadow-color="0.0/0.0/0.0/0.75"
sub-margin-y=42

# --- Screenshots de Alta Qualidade ---
screenshot-format=png
screenshot-png-compression=7
screenshot-template="%F_snapshot_%wH.%wM.%wS"
screenshot-directory="~/pictures"
