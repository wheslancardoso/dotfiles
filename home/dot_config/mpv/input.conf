# ==============================================================================
# 🎮 MPV GOD MODE — Mapa Mestre de Atalhos (Ergonômico & Produtivo)
# ==============================================================================

# --- Controle Preciso de Velocidade (Passos Limpos & Redondos) ---
[  add speed -0.1
]  add speed  0.1
{  add speed -0.25
}  add speed  0.25
BS set speed 1.0

# --- Navegação Temporal (Seek Suave & Contínuo estilo VLC / Fast Web Seek) ---
RIGHT seek  10
LEFT  seek -10
UP    seek  30
DOWN  seek -30
Shift+RIGHT seek  60
Shift+LEFT  seek -60
Ctrl+RIGHT  seek  300
Ctrl+LEFT   seek -300

# --- Fila de Séries & Gestor de Episódios ---
ENTER       script-binding uosc/playlist
>           playlist-next
<           playlist-prev
Shift+>     playlist-next
Shift+<     playlist-prev

# --- Áudio, Volume & Modo Noturno ---
WHEEL_UP    add volume 2
WHEEL_DOWN  add volume -2
m           cycle mute
n           script-binding night_mode/toggle                     # Modo Noturno (Normaliza picos / clareia vozes)
a           cycle audio                                          # Trocar áudio (Smart-Lang sincroniza legenda junto!)
A           cycle audio down

# --- Inteligência de Legendas & Fim do Forçado ---
v           cycle sub-visibility
# V (Shift+v): Mata forçadamente qualquer legenda indesejada ou cicla apenas trilhas limpas (Sem conflito com CopyQ)
V           script-binding forced_sub_killer/toggle_sub_strip

# Sincronização em Tempo Real (50ms por clique)
z           add sub-delay -0.05
Z           add sub-delay +0.05
Alt+z       set sub-delay 0.0

# Sincronização Inteligente por Voz (Universal: Embutidas e Externas via ffsubsync)
Ctrl+z       script-binding sub_sync/sync_current
Ctrl+Shift+z script-binding sub_sync/sync_current

# Smart Auto-Detect de Framerate (Lê o FPS do vídeo e aplica a correção certa com 1 tecla!)
Alt+f        script-binding sub_sync/smart_fps_cycle

# Download Automático de Legendas (OpenSubtitles)
Ctrl+s       script-binding sub_download/download_subtitles

# Pular Abertura / Vinheta de Série (Netflix / Crunchyroll Style)
TAB          script-binding skip_intro/skip_intro

# Máscara contra Hardsub (Legendas queimadas na imagem)
Alt+b       script-binding hardsub_mask/toggle_mask

# --- 🧠 Smart-Resume: Histórico Inteligente & Continuar Assistindo ---
H           script-binding smart_resume/show_history             # 📺 Menu HUD de séries/filmes recentes
Ctrl+h      script-binding smart_resume/show_history

# --- 🧠 Smart-Lang: Super-Inteligência de Idioma & Dual Audio ---
# Ao trocar áudio (a/A), a legenda troca junto automaticamente (zero atrito!)
Alt+e       script-binding smart_lang/immersion_mode             # 🇬🇧 Modo Imersão: Áudio EN + Legenda EN
Alt+p       script-binding smart_lang/native_mode                # 🇧🇷 Modo Nativo: Áudio PT + Legenda PT
Ctrl+e      script-binding smart_lang/toggle_dual_subs           # 📝 Dual Sub: EN embaixo + PT em cima (estudo)

# --- Modo Imersão em Inglês (sub-skip / Acelera nos Silêncios) ---
Alt+i       script-binding sub_skip/toggle
Ctrl+n      script-binding sub_skip/toggle
Alt+m       script-binding sub_skip/toggle_mode
Alt+]       script-binding sub_skip/speed_up
Alt+[       script-binding sub_skip/speed_down

# --- Ajuda & HUD Visual na Tela (Nunca esqueça os atalhos!) ---
?           script-binding cheatsheet/toggle
F1          script-binding cheatsheet/toggle
h           script-binding cheatsheet/toggle
ESC         set fullscreen no; script-binding cheatsheet/close; script-binding auto_next/cancel

# --- Controles pelo Mouse (Zero Atrito) ---
MBTN_LEFT_DBL cycle fullscreen
MBTN_MID      cycle pause
MBTN_RIGHT    script-binding uosc/menu

# --- 🎬 Shaders de IA para Filmes & Séries Live-Action (FSRCNNX Neural Network) ---
Ctrl+4 no-osd change-list glsl-shaders set "~~/shaders/Cinema/FSRCNNX_x2_16-0-4-1.glsl"; show-text "🎬 Cinema IA: FSRCNNX Super-Resolution 16-Core (Fidelidade Máxima)"
Ctrl+5 no-osd change-list glsl-shaders set "~~/shaders/Cinema/FSRCNNX_x2_8-0-4-1.glsl"; show-text "🎬 Cinema IA: FSRCNNX Fast 8-Core (Ultra-Fluido)"

# --- ✨ Shaders de IA para Animes & Desenhos (Anime4K Neural Suite) ---
Ctrl+1 no-osd change-list glsl-shaders set "~~/shaders/Anime4K/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K/Anime4K_Restore_CNN_VL.glsl:~~/shaders/Anime4K/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "✨ Anime4K: Perfil A (Alta Qualidade / Traço Limpo)"
Ctrl+2 no-osd change-list glsl-shaders set "~~/shaders/Anime4K/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K/Anime4K_Restore_CNN_Soft_VL.glsl:~~/shaders/Anime4K/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "✨ Anime4K: Perfil B (Restauração / Imagem Suave)"
Ctrl+3 no-osd change-list glsl-shaders set "~~/shaders/Anime4K/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K/Anime4K_Upscale_Denoise_CNN_x2_VL.glsl:~~/shaders/Anime4K/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "✨ Anime4K: Perfil C (Redução de Ruído & Compressão)"
Ctrl+0 no-osd change-list glsl-shaders clr ""; show-text "🧹 Shaders Desativados (Fidelidade Nativa)"

# --- 📺 Menu de Qualidade de Stream (YouTube / Twitch / HLS) ---
Ctrl+q script-binding quality_menu/video_formats_toggle
Alt+q  script-binding quality_menu/audio_formats_toggle

# --- 🔄 Recarregar Stream Mantendo Posição ---
Ctrl+r script-binding reload_resume

# --- ✂️ Dynamic Crop: Corte Automático Inteligente de Barras Pretas ---
# C (Shift+c): Alterna entre ATIVADO (dinâmico) / FIXAR CORTE ATUAL / DESATIVADO
C      script-binding dynamic_crop/toggle

# --- Screenshots & Saída ---
s           screenshot
S           screenshot video
q           quit
Q           quit-watch-later
