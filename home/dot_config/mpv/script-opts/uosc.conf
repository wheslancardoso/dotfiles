# ==============================================================================
# 🎨 UOSC — Configuração de UI e Controles Modernos para MPV
# ==============================================================================

# Estilo da linha do tempo: 'line' | 'bar'
timeline_style=line
timeline_line_width=3
timeline_size=32
timeline_persistency=hover

# Opacidade dos controles (0 a 255)
controls_margin=16
controls_size=32
controls=menu,gap,subtitles<has_many_sub>,audio<has_many_audio>,gap,speed,gap,space,prev,play-pause,next,space,gap,fullscreen

# Menus e contexto
menu_min_width=280
languages=pt,en

# Animações e transições suaves
animation_duration=150
autohide_delay=1.5
