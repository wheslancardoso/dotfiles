# ==============================================================================
# 🎨 UOSC — Configuração de UI e Controles Modernos para MPV
# ==============================================================================

# Estilo da linha do tempo: 'line' | 'bar'
timeline_style=line
timeline_line_width=3
timeline_size=32
timeline_persistency=hover

# Opacidade e controles
controls_margin=16
controls_size=32
controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,gap,space,<video,audio>speed,space,prev,play-pause,next,gap,fullscreen

# Menus e contexto
menu_min_width=280
languages=pt,en

# Animações e transições suaves
animation_duration=150
autohide=no

# Velocidade de reprodução com passos limpos (sem números quebrados)
speed_step=0.1
speed_step_is_factor=no
