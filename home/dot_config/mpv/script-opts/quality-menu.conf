# ==============================================================================
# 📺 Quality Menu - Seleção Simples e Direta de Resolução
# ==============================================================================
# Consulta os formatos reais do vídeo e aplica deduplicação automática
# para exibir apenas 1 opção limpa por resolução (com a melhor qualidade/bitrate).
fetch_formats=yes

# Formatação limpa do menu (Resolução e FPS na esquerda | Bitrate e HDR na direita)
columns_video=-resolution,frame_rate|bitrate_total,dynamic_range
columns_audio=language,audio_sample_rate|bitrate_total

# Ordenação por maior resolução e taxa de bits
sort_video=height,fps,tbr,size,format_id
sort_audio=asr,tbr,size,format_id

# Tempo para o menu fechar sozinho se inativo (segundos)
menu_timeout=6
