# ==============================================================================
# 📺 Quality Menu - Seleção Simples e Direta de Resolução
# ==============================================================================
# Desativa a listagem confusa de múltiplos codecs brutos (VP9, AV01, AVC1, etc.)
# e exibe um menu limpo apenas com as resoluções principais.
# O MPV seleciona automaticamente o melhor codec/stream para a resolução escolhida.
fetch_formats=no

# Resoluções organizadas de forma limpa (Máximo 1080p, sem 4K desnecessário)
quality_strings_video=[{"1080p (Full HD)":"bestvideo[height<=?1080]"},{"720p (HD 60fps)":"bestvideo[height<=?720]"},{"480p (SD)":"bestvideo[height<=?480]"},{"360p (Econômico)":"bestvideo[height<=?360]"},{"240p (Super Leve)":"bestvideo[height<=?240]"},{"144p (Mínimo)":"bestvideo[height<=?144]"}]

# Qualidade de áudio padrão (Sempre o melhor áudio disponível)
quality_strings_audio=[{"Melhor Áudio (Opus/AAC Alta Fidelidade)":"bestaudio/best"}]

# Tempo para o menu fechar sozinho se inativo (segundos)
menu_timeout=6
