# 🖥️ Configuração de Monitores (Hyprland Dual-Monitor Setup)

# Monitor Primário (DP-1 - KTC 100Hz MK241Y)
# Posição: 1920x0 (ou 0x0 se for o display esquerdo), 1920x1080 @ 99.65Hz
monitor = DP-1, 1920x1080@99.65, 1920x0, 1

# Monitor Secundário (HDMI-A-1 - LG FULL HD 75Hz)
# Posição: 0x0 (à esquerda do DP-1), 1920x1080 @ 74.97Hz
monitor = HDMI-A-1, 1920x1080@74.97, 0x0, 1

# Fallbacks automáticos para novos monitores plugados
monitor = , preferred, auto, 1
monitor = , highrr, auto, 1
monitor = , highres, auto, 1
