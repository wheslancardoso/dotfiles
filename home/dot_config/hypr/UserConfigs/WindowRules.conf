# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates

# CopyQ Clipboard Manager - Flutuante centralizado com ALT+V
windowrulev2 = float, class:^(com\.github\.hluk\.copyq|copyq|CopyQ)$
windowrulev2 = center, class:^(com\.github\.hluk\.copyq|copyq|CopyQ)$
windowrulev2 = size 55% 65%, class:^(com\.github\.hluk\.copyq|copyq|CopyQ)$
windowrulev2 = stayfocused, class:^(com\.github\.hluk\.copyq|copyq|CopyQ)$
# Yazi Floating File Manager & Browser File Picker (Dialog Upload/Download)
windowrulev2 = float, class:^(yazi_picker|floating_yazi)$
windowrulev2 = center, class:^(yazi_picker|floating_yazi)$
windowrulev2 = size 65% 75%, class:^(yazi_picker|floating_yazi)$
windowrulev2 = stayfocused, class:^(yazi_picker)$
windowrulev2 = opacity 0.95 0.90, class:^(yazi_picker|floating_yazi)$

# Suporte também para janelas com título yazi-float
windowrulev2 = float, title:^(yazi-float)$
windowrulev2 = center, title:^(yazi-float)$
windowrulev2 = size 65% 75%, title:^(yazi-float)$
windowrulev2 = stayfocused, title:^(yazi-float)$
windowrulev2 = opacity 0.95 0.90, title:^(yazi-float)$

# EasyEffects
windowrulev2 = float, class:^(com\.github\.wwmm\.easyeffects)$
windowrulev2 = center, class:^(com\.github\.wwmm\.easyeffects)$
windowrulev2 = size 70% 70%, class:^(com\.github\.wwmm\.easyeffects)$

# Gamescope
windowrulev2 = fullscreen, class:^(gamescope)$

# Picture-in-Picture
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$

# Vesktop / Discord
windowrulev2 = opacity 0.98 0.98, class:^(Vesktop|vesktop)$

# Floating Dropdown Scratchpad Terminal (Quake style)
windowrulev2 = float, class:^(scratchpad_term)$
windowrulev2 = center, class:^(scratchpad_term)$
windowrulev2 = size 85% 80%, class:^(scratchpad_term)$
windowrulev2 = workspace special:scratchpad, class:^(scratchpad_term)$

# 🧮 Calculadora Descente com Conversor de Moedas e Unidades (Flutuante centralizada)
windowrulev2 = float, class:^(org\.gnome\.Calculator|gnome-calculator|qalculate-gtk)$
windowrulev2 = center, class:^(org\.gnome\.Calculator|gnome-calculator|qalculate-gtk)$
windowrulev2 = size 430 640, class:^(org\.gnome\.Calculator|gnome-calculator)$
windowrulev2 = size 620 680, class:^(qalculate-gtk)$
windowrulev2 = stayfocused, class:^(org\.gnome\.Calculator|gnome-calculator)$

# 📅 Calendário Interativo Completo (Flutuante centralizado)
windowrulev2 = float, class:^(org\.gnome\.Calendar|gnome-calendar)$
windowrulev2 = center, class:^(org\.gnome\.Calendar|gnome-calendar)$
windowrulev2 = size 65% 72%, class:^(org\.gnome\.Calendar|gnome-calendar)$
windowrulev2 = stayfocused, class:^(org\.gnome\.Calendar|gnome-calendar)$

# ⏰ Relógio Mundial, Cronômetro, Timer e Alarmes (Flutuante centralizado)
windowrulev2 = float, class:^(org\.gnome\.clocks|gnome-clocks)$
windowrulev2 = center, class:^(org\.gnome\.clocks|gnome-clocks)$
windowrulev2 = size 55% 65%, class:^(org\.gnome\.clocks|gnome-clocks)$
windowrulev2 = stayfocused, class:^(org\.gnome\.clocks|gnome-clocks)$

# 🏢 Suporte Corporativo & Enterprise (Remmina, MicroSIP, Virt-Manager)
windowrulev2 = float, class:^(org\.remmina\.Remmina|remmina)$
windowrulev2 = center, class:^(org\.remmina\.Remmina|remmina)$
windowrulev2 = size 75% 80%, class:^(org\.remmina\.Remmina|remmina)$

# MicroSIP / Softphones VoIP (Flutuante compacto e fixável)
windowrulev2 = float, class:^(microsip\.exe|MicroSIP|linphone)$
windowrulev2 = size 340 560, class:^(microsip\.exe|MicroSIP|linphone)$

# Máquinas Virtuais (Virt-Manager)
windowrulev2 = float, class:^(virt-manager)$
windowrulev2 = center, class:^(virt-manager)$
windowrulev2 = size 70% 75%, class:^(virt-manager)$

# 📋 Guia Rápido de Atalhos (Cheat Sheet)
windowrulev2 = float, title:^(.*Cheat Sheet.*)$
windowrulev2 = center, title:^(.*Cheat Sheet.*)$
windowrulev2 = size 68% 78%, title:^(.*Cheat Sheet.*)$
windowrulev2 = stayfocused, title:^(.*Cheat Sheet.*)$

# 🖥️ Configuração de Monitores & Displays (nwg-displays)
windowrulev2 = float, class:^(nwg-displays)$
windowrulev2 = center, class:^(nwg-displays)$
windowrulev2 = size 75% 75%, class:^(nwg-displays)$



