# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates

# CopyQ Clipboard Manager - Flutuante centralizado com ALT+V
windowrulev2 = float, class:^(com\.github\.hluk\.copyq|copyq|CopyQ)$
windowrulev2 = center, class:^(com\.github\.hluk\.copyq|copyq|CopyQ)$
windowrulev2 = size 55% 65%, class:^(com\.github\.hluk\.copyq|copyq|CopyQ)$
windowrulev2 = stayfocused, class:^(com\.github\.hluk\.copyq|copyq|CopyQ)$
windowrule = match:class ^(floating_yazi)$, float on, center on, size (monitor_w*0.6) (monitor_h*0.7)
windowrule = match:class ^(yazi_picker)$, float on, center on, size (monitor_w*0.65) (monitor_h*0.75), stayfocused on
windowrule = match:class ^(com.github.wwmm.easyeffects)$, float on, center on, size (monitor_w*0.7) (monitor_h*0.7)
windowrule = match:class ^(gamescope)$, fullscreen on
windowrule = match:title ^(Picture-in-Picture)$, float on, pin on
windowrule = match:class ^([Vv]esktop)$, opacity 0.98

# Floating Dropdown Scratchpad Terminal (Quake style)
windowrule = match:class ^(scratchpad_term)$, float on, center on, size (monitor_w*0.85) (monitor_h*0.8)
windowrule = match:class ^(scratchpad_term)$, workspace special:scratchpad
