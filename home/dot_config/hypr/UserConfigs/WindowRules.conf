# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# Updated for Hyprland >= 0.53 & 0.56 (Unified windowrule syntax)

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates

# CopyQ Clipboard Manager - Flutuante centralizado com ALT+V
windowrule = float 1, match:class ^(com\.github\.hluk\.copyq|copyq|CopyQ)$
windowrule = center 1, match:class ^(com\.github\.hluk\.copyq|copyq|CopyQ)$
windowrule = size 55% 65%, match:class ^(com\.github\.hluk\.copyq|copyq|CopyQ)$

# Yazi Floating File Manager & Browser File Picker (Dialog Upload/Download)
windowrule = float 1, match:class ^(yazi_picker|floating_yazi)$
windowrule = center 1, match:class ^(yazi_picker|floating_yazi)$
windowrule = size 65% 75%, match:class ^(yazi_picker|floating_yazi)$
windowrule = opacity 0.95 0.90, match:class ^(yazi_picker|floating_yazi)$

# Suporte também para janelas com título yazi-float
windowrule = float 1, match:title ^(yazi-float)$
windowrule = center 1, match:title ^(yazi-float)$
windowrule = size 65% 75%, match:title ^(yazi-float)$
windowrule = opacity 0.95 0.90, match:title ^(yazi-float)$

# EasyEffects
windowrule = float 1, match:class ^(com\.github\.wwmm\.easyeffects)$
windowrule = center 1, match:class ^(com\.github\.wwmm\.easyeffects)$
windowrule = size 70% 70%, match:class ^(com\.github\.wwmm\.easyeffects)$

# Gamescope
windowrule = fullscreen 1, match:class ^(gamescope)$

# Picture-in-Picture
windowrule = float 1, match:title ^(Picture-in-Picture)$
windowrule = pin 1, match:title ^(Picture-in-Picture)$

# Vesktop / Discord
windowrule = opacity 0.98 0.98, match:class ^(Vesktop|vesktop)$

# Floating Dropdown Scratchpad Terminal (Quake style)
windowrule = float 1, match:class ^(scratchpad_term)$
windowrule = center 1, match:class ^(scratchpad_term)$
windowrule = size 85% 80%, match:class ^(scratchpad_term)$
windowrule = workspace special:scratchpad, match:class ^(scratchpad_term)$

# 🎵 Spotify / Spicetify — Dropdown Scratchpad de Alta Fidelidade (SUPER + M)
windowrule = float 1, match:class ^(Spotify|spotify)$
windowrule = center 1, match:class ^(Spotify|spotify)$
windowrule = size 72% 78%, match:class ^(Spotify|spotify)$
windowrule = opacity 0.94 0.88, match:class ^(Spotify|spotify)$
windowrule = workspace special:spotify, match:class ^(Spotify|spotify)$
windowrule = rounding 14, match:class ^(Spotify|spotify)$

# 🧮 Calculadora Descente com Conversor de Moedas e Unidades (Flutuante centralizada)
windowrule = float 1, match:class ^(org\.gnome\.Calculator|gnome-calculator|qalculate-gtk)$
windowrule = center 1, match:class ^(org\.gnome\.Calculator|gnome-calculator|qalculate-gtk)$
windowrule = size 430 640, match:class ^(org\.gnome\.Calculator|gnome-calculator)$
windowrule = size 620 680, match:class ^(qalculate-gtk)$

# 📅 Calendário Interativo Completo (Flutuante centralizado)
windowrule = float 1, match:class ^(org\.gnome\.Calendar|gnome-calendar)$
windowrule = center 1, match:class ^(org\.gnome\.Calendar|gnome-calendar)$
windowrule = size 65% 72%, match:class ^(org\.gnome\.Calendar|gnome-calendar)$

# ⏰ Relógio Mundial, Cronômetro, Timer e Alarmes (Flutuante centralizado)
windowrule = float 1, match:class ^(org\.gnome\.clocks|gnome-clocks)$
windowrule = center 1, match:class ^(org\.gnome\.clocks|gnome-clocks)$
windowrule = size 55% 65%, match:class ^(org\.gnome\.clocks|gnome-clocks)$

# 🏢 Suporte Corporativo & Enterprise (Remmina, MicroSIP, Virt-Manager)
windowrule = float 1, match:class ^(org\.remmina\.Remmina|remmina)$
windowrule = center 1, match:class ^(org\.remmina\.Remmina|remmina)$
windowrule = size 75% 80%, match:class ^(org\.remmina\.Remmina|remmina)$

# MicroSIP / Softphones VoIP (Flutuante compacto e fixável)
windowrule = float 1, match:class ^(microsip\.exe|MicroSIP|linphone)$
windowrule = size 340 560, match:class ^(microsip\.exe|MicroSIP|linphone)$

# Máquinas Virtuais (Virt-Manager)
windowrule = float 1, match:class ^(virt-manager)$
windowrule = center 1, match:class ^(virt-manager)$
windowrule = size 70% 75%, match:class ^(virt-manager)$

# 📋 Guia Rápido de Atalhos (Cheat Sheet)
windowrule = float 1, match:title ^(.*Cheat Sheet.*)$
windowrule = center 1, match:title ^(.*Cheat Sheet.*)$
windowrule = size 68% 78%, match:title ^(.*Cheat Sheet.*)$

# 🖥️ Configuração de Monitores & Displays (nwg-displays)
windowrule = float 1, match:class ^(nwg-displays)$
windowrule = center 1, match:class ^(nwg-displays)$
windowrule = size 75% 75%, match:class ^(nwg-displays)$

# 💾 Gerenciamento de Discos & Partições (GParted & Baobab)
windowrule = float 1, match:class ^(GParted|gparted)$
windowrule = center 1, match:class ^(GParted|gparted)$
windowrule = size 75% 75%, match:class ^(GParted|gparted)$

windowrule = float 1, match:class ^(org\.gnome\.baobab|baobab)$
windowrule = center 1, match:class ^(org\.gnome\.baobab|baobab)$
windowrule = size 70% 70%, match:class ^(org\.gnome\.baobab|baobab)$

# 🎬 Reprodutor de Vídeo (Celluloid)
windowrule = float 1, match:class ^(io\.github\.celluloid_player\.Celluloid|celluloid)$
windowrule = center 1, match:class ^(io\.github\.celluloid_player\.Celluloid|celluloid)$
windowrule = size 75% 75%, match:class ^(io\.github\.celluloid_player\.Celluloid|celluloid)$

# 📱 Integração Smartphone (KDE Connect)
windowrule = float 1, match:class ^(org\.kde\.kdeconnect.*|kdeconnect.*)$
windowrule = center 1, match:class ^(org\.kde\.kdeconnect.*|kdeconnect.*)$

# 📥 Downloads & Torrents (qBittorrent)
windowrule = float 1, match:class ^(org\.qbittorrent\.qBittorrent|qbittorrent)$
windowrule = center 1, match:class ^(org\.qbittorrent\.qBittorrent|qbittorrent)$
windowrule = size 75% 75%, match:class ^(org\.qbittorrent\.qBittorrent|qbittorrent)$

# 🪟 Virtualização Gráfica (Quickgui)
windowrule = float 1, match:class ^(quickgui)$
windowrule = center 1, match:class ^(quickgui)$
windowrule = size 65% 70%, match:class ^(quickgui)$

# 📸 Flameshot Screenshot Tool (Wayland / Hyprland compatibility rules)
windowrule = float 1, match:class ^(flameshot)$
windowrule = move 0 0, match:class ^(flameshot)$
windowrule = pin 1, match:class ^(flameshot)$
windowrule = fullscreen_state 2, match:class ^(flameshot)$
windowrule = no_anim 1, match:class ^(flameshot)$

# 🖼️ IMV Fast Image Viewer (Flutuante centralizado ultraleve)
windowrule = float 1, match:class ^(imv)$
windowrule = center 1, match:class ^(imv)$
windowrule = size 75% 75%, match:class ^(imv)$

# 📲 LocalSend AirDrop P2P (Flutuante centralizado para celular/PC)
windowrule = float 1, match:class ^(localsend|LocalSend|localsend_app)$
windowrule = center 1, match:class ^(localsend|LocalSend|localsend_app)$
windowrule = size 62% 72%, match:class ^(localsend|LocalSend|localsend_app)$

# 📊 Btop TUI Task Manager (Flutuante centralizado de alta performance)
windowrule = float 1, match:title ^(btop)$
windowrule = center 1, match:title ^(btop)$
windowrule = size 82% 82%, match:title ^(btop)$
windowrule = opacity 0.95 0.90, match:title ^(btop)$
windowrule = rounding 12, match:title ^(btop)$
