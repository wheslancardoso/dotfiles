# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 2
  gaps_in = 3
  gaps_out = 6

  col.active_border = $color12 $color11 $color14 45deg
  col.inactive_border = rgba(283042aa)
}

decoration {
  rounding = 12
  
  active_opacity = 1.0
  inactive_opacity = 0.94
  fullscreen_opacity = 1.0

  # Foco cinematográfico: janela inativa fica sutilmente rebaixada e scratchpads ganham destaque luxuoso
  dim_inactive = true
  dim_strength = 0.08
  dim_special = 0.35

  # Sombras orgânicas e difusas (estilo macOS Sequoia / VisionOS)
  shadow {
    enabled = true
    range = 25
    render_power = 3

    color = rgba(00000055)
    color_inactive = rgba(00000025)
  }

  # Desfoque de vidro fosco de alta fidelidade (Catppuccin Glassmorphism)
  blur {
    enabled = true
    size = 8
    passes = 3
    new_optimizations = true
    xray = false
    ignore_opacity = true
    special = true
    popups = true
    noise = 0.015
    contrast = 0.95
    brightness = 0.95
  }
}

group {
  col.border_active = $color15

	groupbar {
		col.active = $color0
  }
}
