# User Settings - Zero Micro-Friction Edition

# Redimensionamento suave nas bordas sem exigir precisão de pixel
general {
  resize_on_border = true
  extend_border_grab_area = 20
  hover_icon_on_border = true
  layout = dwindle
}

# Layouts de Teclado:
# 1. us (intl) -> US Internacional com Dead Keys (acentos: á, é, ç, ã)
# 2. br        -> ABNT2 Brasileiro (com Ç físico)
# 3. us        -> US Puro sem Dead Keys (Dev / Código / Aspas instantâneas)
input {
  kb_layout = us,br,us
  kb_variant = intl,,
  kb_options = grp:alt_shift_toggle,caps:swapescape
  follow_mouse = 1
  float_switch_override_focus = 2
  mouse_refocus = true
  sensitivity = 0
  natural_scroll = false # Mouse tradicional de mesa com rolagem idêntica ao Windows
  scroll_factor = 1.0    # Sensibilidade de rolagem suave e precisa
  touchpad {
    natural_scroll = true
    tap-to-click = true
    disable_while_typing = true
  }
}

# Foco ao abrir links/apps, swallow de janelas do terminal e economia de energia
misc {
  focus_on_activate = true
  mouse_move_enables_dpms = true
  vrr = 2 # 2 = Adaptive Sync ativo apenas em tela cheia (elimina flicker em desktop estático)
  enable_swallow = true
  swallow_regex = ^(kitty|ghostty|alacritty)$
  middle_click_paste = false # Previne que o clique do botão de scroll cole texto acidentalmente no terminal/editor
}

# 🚀 Pipeline de Renderização & Latência Zero (NVIDIA RTX 5060 Blackwell)
render {
  direct_scanout = 2           # 2 = Bypass direto de composição em tela cheia (zero latência em jogos/MPV)
  new_render_scheduling = true # Agendamento preciso de frames em 100Hz sem judder
}

# Esconde o cursor após inatividade para não atrapalhar leitura/código
cursor {
  no_warps = true
  inactive_timeout = 3
  enable_hyprcursor = true
  no_hardware_cursors = false # Hardware cursors na GPU RTX 5060 (Zero lag de mouse)
  sync_gsettings_theme = true
}

# Logitech K380 / K380s Bluetooth Keyboard explicit mapping
device {
  name = logitech-k380s-keyboard
  kb_layout = us,br,us
  kb_variant = intl,,
  kb_options = grp:alt_shift_toggle,caps:swapescape
}

device {
  name = k380-keyboard
  kb_layout = us,br,us
  kb_variant = intl,,
  kb_options = grp:alt_shift_toggle,caps:swapescape
}

# 🎧 Bluetooth Headsets AVRCP Ignore (Evita que o fone dê Play/Pause no PC ao usar Multipoint com o celular)
device {
  name = qcy-h3s-(avrcp)
  enabled = false
}

device {
  name = qcy-melobuds-anc-(avrcp)
  enabled = false
}


# 🖱️ Shake to Find Cursor (Igual ao KDE Plasma / macOS)
# Chacoalhar o mouse faz o cursor crescer instantaneamente para achá-lo na tela
# hyprlang noerror true
plugin:dynamic-cursors {
  enabled = true
  mode = stretch

  stretch {
    limit = 3000
    activation = negative_quadratic
    window = 100
  }

  shake {
    enabled = false
    threshold = 8.0
    base = 3.0
    speed = 4.0
    influence = 0.0
    limit = 0.0
    timeout = 1000
    effects = false
  }

  hyprcursor {
    nearest = 1
    enabled = true
    resolution = -1
    fallback = clientside
  }
}
# hyprlang noerror false

