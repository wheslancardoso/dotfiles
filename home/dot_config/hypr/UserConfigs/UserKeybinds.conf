# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

#  IMPORTANT: If you want to remap and existing keybind you MUST unbindd it first 

# The bindings are CASE SENSITIVE. We suggest you copy the exisitng binding here
#  Then change `bindd` to `unbind`

# E.g. 
# unbind = $mainMod, Return, Open terminal, exec, $term
# bindd = $mainMod, Return, Open terminal, exec, ghostty 
#
# unbind = $mainMod, E, file manager, exec, $files
# bindd = $mainMod, T, file manager, exec, $files

# If you are ADDING a bindd, make sure you include the description 
# Other the keybind search menu might not show it properly 

# E.g.
# bindd = $mainMod, Z, My z app, exec APPNAME

# 📋 Clipboard Manager Desacoplado:
# SUPER + V -> Rofi + Cliphist (Busca instantânea de 2ms com fuzzy search para colar rápido)
# ALT + V   -> CopyQ (Painel avançado com abas, snippets fixados, imagens e editor)
unbind = $mainMod, V
unbind = $mainMod, v
bindd = $mainMod, v, fast clipboard search (cliphist), exec, pkill rofi || $scriptsDir/ClipManager.sh
bindd = $mainMod, V, fast clipboard search (cliphist), exec, pkill rofi || $scriptsDir/ClipManager.sh
bindd = ALT, v, advanced clipboard manager (copyq), exec, copyq toggle
bindd = ALT, V, advanced clipboard manager (copyq), exec, copyq toggle
# 🚀 Menu de Aplicativos (SUPER + D)
bindd = $mainMod, d, app launcher, exec, pkill rofi || rofi -show drun -modi drun,filebrowser,run,window
bindd = $mainMod, D, app launcher, exec, pkill rofi || rofi -show drun -modi drun,filebrowser,run,window

# File Manager:
# SUPER + E       -> Yazi no modo tiling normal (ladrilhado)
# SUPER + SHIFT + E -> Yazi centralizado em janela flutuante
unbind = $mainMod, E
unbind = $mainMod, e
unbind = $mainMod SHIFT, E
unbind = $mainMod SHIFT, e

bindd = $mainMod, e, file manager tiling (yazi), exec, $UserScripts/open-yazi-tiled.sh
bindd = $mainMod, E, file manager tiling (yazi), exec, $UserScripts/open-yazi-tiled.sh

bindd = $mainMod SHIFT, e, file manager floating (yazi), exec, $UserScripts/open-yazi.sh
bindd = $mainMod SHIFT, E, file manager floating (yazi), exec, $UserScripts/open-yazi.sh

# Upload Rápido de Documentos (Acesso Rápido - CNH, RG, Comprovantes em janela flutuante)
bindd = $mainMod SHIFT, d, upload rapido documentos (acesso rapido), exec, $UserScripts/open-acesso-rapido.sh
bindd = $mainMod SHIFT, D, upload rapido documentos (acesso rapido), exec, $UserScripts/open-acesso-rapido.sh

# Sincronização Imediata de Saves de Jogos e Emuladores para a Nuvem (Ludusavi)
bindd = $mainMod ALT, s, sincronizar saves (ludusavi), exec, $UserScripts/sync-ludusavi.sh
bindd = $mainMod ALT, S, sincronizar saves (ludusavi), exec, $UserScripts/sync-ludusavi.sh

# ☁️ Google Drive 5TB (Rclone VFS Streaming On-Demand)
bindd = $mainMod ALT, g, toggle google drive 5tb (rclone), exec, $HOME/dotfiles/scripts/gdrive-mount.sh toggle
bindd = $mainMod ALT, G, toggle google drive 5tb (rclone), exec, $HOME/dotfiles/scripts/gdrive-mount.sh toggle

# Atalho alternativo para o menu de configurações rápidas do KooL
bindd = $mainMod CTRL, comma, quick settings menu, exec, $scriptsDir/Kool_Quick_Settings.sh

# Dropdown / Scratchpad Terminal (Quake style)
bindd = $mainMod, grave, dropdown scratchpad terminal, exec, $HOME/.config/hypr/scripts/scratchpad-term.sh
bindd = $mainMod, u, dropdown scratchpad terminal (alt), exec, $HOME/.config/hypr/scripts/scratchpad-term.sh

# 🎵 Dropdown Scratchpad do Spotify (Desce do topo com blur Catppuccin e some suavemente)
unbind = $mainMod, M
unbind = $mainMod, m
bindd = $mainMod, m, toggle spotify dropdown scratchpad, exec, $HOME/.config/hypr/scripts/spotify-toggle.sh
bindd = $mainMod, M, toggle spotify dropdown scratchpad, exec, $HOME/.config/hypr/scripts/spotify-toggle.sh

# ⏯️ Controles de Mídia Globais (Sem precisar de teclas Fn)
bindd = $mainMod CTRL, space, play pause media, exec, playerctl play-pause
bindd = $mainMod CTRL, bracketright, next track, exec, playerctl next
bindd = $mainMod CTRL, bracketleft, previous track, exec, playerctl previous

# Seletor Visual de Janelas Abertas (Rofi Window Switcher com busca e ícones)
unbind = $mainMod, Tab
bindd = $mainMod, Tab, visual window switcher, exec, pkill rofi || rofi -show window -theme ~/.config/rofi/themes/KooL_style-4.rasi

# 📸 Captura de Tela Avançada com Flameshot (SUPER + SHIFT + S ou tecla Print)
unbind = $mainMod SHIFT, S
unbind = $mainMod SHIFT, s
bindd = $mainMod SHIFT, S, screenshot region (flameshot), exec, $scriptsDir/ScreenShot.sh --flameshot
bindd = $mainMod SHIFT, s, screenshot region (flameshot), exec, $scriptsDir/ScreenShot.sh --flameshot
bindd = , Print, screenshot region (flameshot), exec, $scriptsDir/ScreenShot.sh --flameshot

# 🎨 Color Picker Instantâneo (Hex direto pro clipboard)
bindd = $mainMod SHIFT, P, color picker, exec, hyprpicker -a -f hex

# 🔍 Screen OCR (Copiar texto de qualquer imagem/vídeo da tela)
bindd = $mainMod SHIFT, T, screen ocr text copy, exec, $HOME/.config/hypr/scripts/ocr-screen.sh

# 🎥 Gravação de Tela Instantânea em MP4/GIF (SUPER + SHIFT + R ou SUPER + ALT + R)
unbind = $mainMod ALT, R
unbind = $mainMod ALT, r
bindd = $mainMod SHIFT, R, toggle screen recording, exec, $HOME/.config/hypr/scripts/screen-record.sh
bindd = $mainMod SHIFT, r, toggle screen recording, exec, $HOME/.config/hypr/scripts/screen-record.sh
bindd = $mainMod ALT, R, toggle screen recording (alt), exec, $HOME/.config/hypr/scripts/screen-record.sh
bindd = $mainMod ALT, r, toggle screen recording (alt), exec, $HOME/.config/hypr/scripts/screen-record.sh

# 🔀 Alternador Rápido de Saída de Áudio & Microfone
bindd = $mainMod SHIFT, A, switch audio output sink, exec, $HOME/.config/hypr/scripts/audio-switch.sh
bindd = $mainMod SHIFT, a, switch audio output sink, exec, $HOME/.config/hypr/scripts/audio-switch.sh
bindd = $mainMod ALT, A, switch audio output sink (alt), exec, $HOME/.config/hypr/scripts/audio-switch.sh
bindd = $mainMod ALT, a, switch audio output sink (alt), exec, $HOME/.config/hypr/scripts/audio-switch.sh
bindd = $mainMod ALT, M, toggle microphone mute, exec, $scriptsDir/Volume.sh --toggle-mic
bindd = $mainMod ALT, m, toggle microphone mute, exec, $scriptsDir/Volume.sh --toggle-mic

# 📶 Conectividade Rápida (Bluetooth & Wi-Fi sem janelas pesadas)
unbind = $mainMod ALT, B
unbind = $mainMod ALT, b
bindd = $mainMod ALT, b, bluetooth quick manager, exec, $HOME/.config/hypr/scripts/rofi-bluetooth.sh
bindd = $mainMod ALT, B, bluetooth quick manager, exec, $HOME/.config/hypr/scripts/rofi-bluetooth.sh
bindd = $mainMod ALT, w, wifi quick manager, exec, $HOME/.config/hypr/scripts/rofi-wifi.sh
bindd = $mainMod ALT, W, wifi quick manager, exec, $HOME/.config/hypr/scripts/rofi-wifi.sh

# 📥 Download Rápido de Vídeos & Músicas de Qualquer Site (yt-dlp + aria2c)
bindd = $mainMod ALT, d, media downloader from clipboard, exec, $HOME/.config/hypr/scripts/media-download.sh --rofi
bindd = $mainMod ALT, D, media downloader from clipboard, exec, $HOME/.config/hypr/scripts/media-download.sh --rofi
bindd = $mainMod CTRL, d, download now playing media, exec, $HOME/.config/hypr/scripts/media-download.sh --now
bindd = $mainMod CTRL, D, download now playing media, exec, $HOME/.config/hypr/scripts/media-download.sh --now


# 🖥️ Configuração de Monitores & Displays (Resolução, Mapeamento e Projetor com nwg-displays)
bindd = $mainMod SHIFT, M, monitor and display settings (nwg-displays), exec, nwg-displays
bindd = $mainMod SHIFT, m, monitor and display settings (nwg-displays), exec, nwg-displays
bindd = , XF86Display, monitor and display settings, exec, nwg-displays

# ⌨️ Troca Rápida de Layout de Teclado (US-Intl, ABNT2, US-Dev)
bindd = $mainMod, space, switch keyboard layout, exec, $scriptsDir/KeyboardLayout.sh switch

# 🧮 Calculadora com Conversor de Moedas e Unidades (SUPER + C ou botão físico)
bindd = $mainMod, c, calculator with currency converter, exec, gnome-calculator
bindd = $mainMod, C, calculator with currency converter, exec, gnome-calculator
bindd = , XF86Calculator, calculator, exec, gnome-calculator
bindd = $mainMod ALT, c, qalculate scientific calculator, exec, qalculate-gtk
bindd = $mainMod ALT, C, qalculate scientific calculator, exec, qalculate-gtk

# 👑 Vim Navigation Holy Grail & Cheat Sheet
# Foco entre janelas (SUPER + J, K, L e SUPER + Setas)
bindd = $mainMod, l, focus window right, movefocus, r
bindd = $mainMod, k, focus window up, movefocus, u
bindd = $mainMod, j, focus window down, movefocus, d

# 📋 Guia Mestre de Atalhos (SUPER + H, SUPER + SHIFT + H ou SUPER + /)
unbind = $mainMod, H
unbind = $mainMod, h
unbind = $mainMod SHIFT, H
unbind = $mainMod SHIFT, h
bindd = $mainMod, h, quick cheat sheet, exec, $scriptsDir/KeyHints.sh
bindd = $mainMod, H, quick cheat sheet, exec, $scriptsDir/KeyHints.sh
bindd = $mainMod SHIFT, H, quick cheat sheet, exec, $scriptsDir/KeyHints.sh
bindd = $mainMod SHIFT, h, quick cheat sheet, exec, $scriptsDir/KeyHints.sh
bindd = $mainMod, slash, quick cheat sheet (alt), exec, $scriptsDir/KeyHints.sh
# Nota: se preferir Super + H para mover o foco para a esquerda em vez do Cheat Sheet, descomente:
# bindd = $mainMod, h, focus window left, movefocus, l



# 2. Mover janelas no grid de tiling (SUPER + CTRL + H, J, K, L)
bindd = $mainMod CTRL, h, move window left, movewindow, l
bindd = $mainMod CTRL, l, move window right, movewindow, r
bindd = $mainMod CTRL, k, move window up, movewindow, u
bindd = $mainMod CTRL, j, move window down, movewindow, d

# 3. Redimensionamento suave contínuo sem mouse (SUPER + ALT + H, J, K, L)
binde = $mainMod ALT, h, resize window left, resizeactive, -30 0
binde = $mainMod ALT, l, resize window right, resizeactive, 30 0
binde = $mainMod ALT, k, resize window up, resizeactive, 0 -30
binde = $mainMod ALT, j, resize window down, resizeactive, 0 30

# Zero-Friction Mouse Bindings:
# SUPER + Botão Esquerdo arrasta para mover qualquer janela
# SUPER + Botão Direito arrasta para redimensionar
# SUPER + Botão do Meio alterna entre flutuante e ladrilhado
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse:274, togglefloating

# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset
