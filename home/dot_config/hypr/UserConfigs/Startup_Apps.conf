# Commands and Apps to be executed at launch

exec-once = copyq

# Automount inteligente de pen-drives e HDs externos com ícone na Waybar e notificações
exec-once = udiskie --no-notify-tray --tray &

# Inicializar o GNOME Keyring para salvar credenciais com suporte a todos os componentes
exec-once = gnome-keyring-daemon --start --components=secrets,ssh,pkcs11

# Garantir que o Portal e o Keyring tenham acesso às variáveis da sessão
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP GTK_USE_PORTAL GNOME_KEYRING_CONTROL GNOME_KEYRING_PID SSH_AUTH_SOCK

# Restaurar o último wallpaper ao iniciar (ou Night_City.png como padrão) e sincronizar cores do Wallust
exec-once = bash -c 'wp=$(cat ~/.cache/current_wallpaper 2>/dev/null); [ -f "$wp" ] || wp="$HOME/pictures/wallpapers/Night_City.png"; [ -f "$wp" ] || wp="$HOME/Pictures/wallpapers/Night_City.png"; [ -f "$wp" ] || wp="$HOME/.config/hypr/wallpaper_effects/.wallpaper_current"; awww query || awww-daemon --format xrgb; awww img "$wp"; "$HOME/.config/hypr/scripts/WallustSwww.sh" "$wp" &'

# Áudio & Microfone com Supressão de Ruído em segundo plano
exec-once = easyeffects --gapplication-service

# Notificações com Capa de Álbum em Tempo Real (Spotify / MPRIS)
exec-once = $HOME/.config/hypr/UserScripts/MusicNotification.sh

# Carregar plugins do Hyprland (ex: hypr-dynamic-cursors shake effect)
exec-once = hyprpm reload -n || true

