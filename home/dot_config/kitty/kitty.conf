# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #

# Theme: Catppuccin Mocha (Alta Fidelidade & Contraste Ouro)
include ./kitty-themes/Catppuccin-Mocha.conf

# Tipografia de Alta Performance
font_family JetBrainsMono Nerd Font
font_size 11.5
bold_font auto
italic_font auto
bold_italic_font auto

# Transparência & Efeitos Visuais
background_opacity 0.94
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor & Physics suave
cursor_shape block
cursor_blink_interval 0.5
cursor_trail 1
cursor_trail_decay 0.15 0.35
cursor_trail_start_threshold 1

# Display & Performance
linux_display_server auto
scrollback_lines 5000
wheel_scroll_min_lines 1
enable_audio_bell no
window_padding_width 12