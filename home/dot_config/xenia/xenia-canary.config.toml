# Xenia Canary - Configuração Global de Desempenho Máximo (NVIDIA RTX 5060 + Ryzen 7 5700X)
# Otimizado para jogos de mundo aberto pesados (Forza Horizon 1/2, Midnight Club LA, RDR, Gears)

[APU]
apu = "any"
mute = false

[CPU]
break_on_unimplemented_instructions = false
clock_no_scaling = false
clock_scale = 1.0

[Content]
license_mask = 0

[Display]
fullscreen = false
internal_display_resolution = 8 # 720p nativo do console (garante 60 FPS cravados sem gargalo de fillrate)
window_high_dpi = true

[GPU]
# d3d12_readback_resolve e clear_memory_page_state matam os vazamentos de VRAM do Forza e MCLA
d3d12_readback_resolve = true
clear_memory_page_state = true
draw_resolution_scale_x = 1
draw_resolution_scale_y = 1
# 60 FPS com sincronização interna do emulador (evita pulo de frames e judder externo)
framerate_limit = 60
gpu = "vulkan"
gpu_allow_any_core = true
render_target_path_vulkan = "fbo"
vsync = true
vsync_interval = 16

[General]
apply_patches = true
discord = true
launch_module = ""
patches_directory = "patches"

[HID]
hid = "sdl"

[Kernel]
clog = false
log_level = 2

[Logging]
flush_log = false

[Memory]
protect_zero = true

[Storage]
mount_cache = true
mount_scratch = true
