# 🌌 Starship Premium Config - "Ultra Powerline" Edition

format = """
[░▒▓](#9A348E)\
[  ](bg:#9A348E fg:#ffffff)\
[](fg:#9A348E bg:#8631B4)\
$directory\
[](fg:#8631B4 bg:#6129AF)\
$git_branch\
$git_status\
[](fg:#6129AF bg:#3A227B)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#3A227B bg:#2E1A5E)\
$time\
[ ](fg:#2E1A5E)\
\n$character"""

[directory]
style = "bg:#8631B4 fg:#ffffff"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "📄 "
"Downloads" = "📥 "
"Music" = "🎵 "
"Pictures" = "🖼️ "
"documents" = "📄 "
"downloads" = "📥 "
"music" = "🎵 "
"pictures" = "🖼️ "
"desktop" = "🖥️ "
"videos" = "🎬 "
"dotfiles" = "⚙️ "
"workspace" = "💻 "
"dev" = "💻 "

[git_branch]
symbol = ""
style = "bg:#6129AF"
format = "[[ $symbol $branch ](fg:#ffffff bg:#6129AF)]($style)"

[git_status]
style = "bg:#6129AF"
format = "[[($all_status$ahead_behind )](fg:#ffffff bg:#6129AF)]($style)"

[nodejs]
symbol = ""
style = "bg:#3A227B"
format = "[[ $symbol ($version) ](fg:#ffffff bg:#3A227B)]($style)"

[rust]
symbol = ""
style = "bg:#3A227B"
format = "[[ $symbol ($version) ](fg:#ffffff bg:#3A227B)]($style)"

[golang]
symbol = ""
style = "bg:#3A227B"
format = "[[ $symbol ($version) ](fg:#ffffff bg:#3A227B)]($style)"

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#2E1A5E"
format = "[[  $time ](fg:#ffffff bg:#2E1A5E)]($style)"

[character]
success_symbol = "[╰─❯](bold green) "
error_symbol = "[╰─❯](bold red) "
