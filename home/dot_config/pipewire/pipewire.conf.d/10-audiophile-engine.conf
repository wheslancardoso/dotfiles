# ==============================================================================
# 🎧 PIPEWIRE AUDIOPHILE ENGINE (Grau de Estúdio & Zero Distorção)
# ==============================================================================
# 1. Taxas de Amostragem Dinâmicas (Bit-Perfect Playback):
#    Permite que áudio Hi-Res (FLAC 96kHz/192kHz) toque nativamente sem
#    o resampling forçado e destrutivo do Windows 11.
# 2. Resampler SoX / Speex em Qualidade Máxima (Quality 10):
#    Interpolação sinc com SNR > 120dB (elimina ruído de quantização e distorção de fase).
# 3. Latência Ultrabaixa e Estável (Zero Buffer Underruns / Pops / Stuttering).
# ==============================================================================

context.properties = {
    # Taxa base padrão e taxas dinâmicas permitidas (44.1k, 48k, 88.2k, 96k, 192k)
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 192000 ]
    
    # Gerenciamento de buffers dinâmicos para latência ultrabaixa em jogos e música
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 32
    default.clock.max-quantum   = 2048

    # Resampler audiófilo em modo qualidade máxima (Estúdio)
    resample.quality            = 10
}
