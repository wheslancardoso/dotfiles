# ==============================================================================
# 🚀 YAZI POWER-USER KEYMAP — Zero Fricção, Máxima Velocidade & Produtividade
# ==============================================================================
# Baseado na arquitetura upstream do Yazi.
# Configuração limpa com prepend_keymap para sobrepor e desbloquear atalhos.
# ==============================================================================

[mgr]
prepend_keymap = [
	# --------------------------------------------------------------------------
	# 📦 COMPRESSÃO RÁPIDA (Prefixo: 'c' de Compress)
	# --------------------------------------------------------------------------
	{ on = [ "c", "z" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-archive.sh compress-zip %s" --block', desc = "Comprimir para .ZIP (Rápido)" },
	{ on = [ "c", "7" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-archive.sh compress-7z %s" --block', desc = "Comprimir para .7Z (Ultra LZMA2)" },
	{ on = [ "c", "t" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-archive.sh compress-tar %s" --block', desc = "Comprimir para .TAR.GZ (Linux)" },
	{ on = [ "c", "c" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-archive.sh compress-custom %s" --block', desc = "Comprimir com Nome Personalizado" },

	# --------------------------------------------------------------------------
	# 📂 EXTRAÇÃO INTELIGENTE (Prefixo: 'e' de Extract ou 'X' de 1-toque)
	# --------------------------------------------------------------------------
	{ on = [ "e", "s" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-archive.sh extract-sub %s" --block', desc = "Extrair para Subpasta Limpa" },
	{ on = [ "e", "x" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-archive.sh extract-here %s" --block', desc = "Extrair Aqui" },
	{ on = "X",          run = 'shell "bash $HOME/dotfiles/scripts/yazi-archive.sh extract-sub %s" --block', desc = "Extrair para Subpasta (1 Toque)" },

	# --------------------------------------------------------------------------
	# 📋 COPIAR CAMINHOS / METADADOS (Desbloqueado e intuitivo)
	# --------------------------------------------------------------------------
	{ on = [ "c", "p" ], run = "copy path", desc = "Copiar Caminho Absoluto" },
	{ on = [ "c", "f" ], run = "copy filename", desc = "Copiar Nome do Arquivo" },
	{ on = [ "c", "d" ], run = "copy dirpath", desc = "Copiar Caminho da Pasta" },

	# --------------------------------------------------------------------------
	# 🚀 RSYNC TURBO (Transferência Segura de HDs Externos / USB)
	# --------------------------------------------------------------------------
	{ on = "R", run = 'shell "bash $HOME/dotfiles/scripts/yazi-rsync.sh %s" --block', desc = "Rsync Turbo (Transferência Segura com Barra de Progresso)" },

	# --------------------------------------------------------------------------
	# 🖱️ DRAG & DROP (Arrastar e Soltar para Navegador / Discord / Drive)
	# --------------------------------------------------------------------------
	{ on = "<C-y>", run = 'shell "ripdrag -x -i -T %s" --confirm', desc = "Arrastar arquivos para Apps/Browser (Drag & Drop)" },

	# --------------------------------------------------------------------------
	# 🔍 BUSCA FUZZY, NAVEGAÇÃO & PLUGINS DE ELITE
	# --------------------------------------------------------------------------
	{ on = "z",          run = "plugin zoxide", desc = "Pulo Rápido Inteligente (Zoxide)" },
	{ on = "Z",          run = 'shell "bash $HOME/dotfiles/scripts/yazi-fzf.sh" --block', desc = "Busca Recursiva FZF Turbo (Toggle Ocultos Ctrl+H + Previews)" },
	{ on = "<C-d>",      run = "plugin diff", desc = "Comparar Diferenças (Diff com Arquivo Selecionado)" },
	{ on = [ "c", "m" ], run = "plugin chmod", desc = "Alterar Permissões (Chmod Interativo)" },
	{ on = [ "M", "m" ], run = "plugin mount", desc = "Gerenciador de Discos / Montagem / Ejeção (Mount Manager)" },
	{ on = "l",          run = "plugin smart-enter", desc = "Entrada Inteligente (Pastas, Arquivos, Zips)" },

	# --------------------------------------------------------------------------
	# 🚀 NAVEGAÇÃO RÁPIDA (GOTO JUMPS - Atalhos Diretos no seu Drive /mnt/dados)
	# --------------------------------------------------------------------------
	{ on = [ "g", "i" ], run = "cd /mnt/dados/00_Inbox", desc = "Ir para 00_Inbox (Downloads)" },
	{ on = [ "g", "p" ], run = "cd /mnt/dados/01_Pessoal", desc = "Ir para 01_Pessoal" },
	{ on = [ "g", "e" ], run = "cd /mnt/dados/03_Estudos_Carreira", desc = "Ir para 03_Estudos_Carreira" },
	{ on = [ "g", "v" ], run = "cd /mnt/dados/04_Dev", desc = "Ir para 04_Dev (Projetos/Git)" },
	{ on = [ "g", "j" ], run = "cd /mnt/dados/06.4_Games", desc = "Ir para 06.4_Games (Jogos & Emuladores)" },
	{ on = [ "g", "m" ], run = "cd /mnt/dados/05_Midias", desc = "Ir para 05_Midias" },
	{ on = [ "g", "u" ], run = "cd /run/media", desc = "Ir para Dispositivos USB / Pen-drives" },
	{ on = [ "g", "b" ], run = "cd /mnt/dados/06_Backups_ISOs_e_Sistemas/06.3_ISOs_e_Boot", desc = "Ir para Pasta de ISOs e Boot" },
	{ on = [ "g", "D" ], run = "cd /mnt/dados", desc = "Ir para Raiz /mnt/dados" },
	{ on = [ "g", "G" ], run = "cd ~/gdrive", desc = "Ir para Google Drive Virtual (5 TB)" },
	{ on = [ "g", "." ], run = "cd ~/dotfiles", desc = "Ir para ~/dotfiles" },

	# --------------------------------------------------------------------------
	# ⚡ INTEGRAÇÃO COM ORGANIZADOR MASTER & FERRAMENTAS DO SISTEMA
	# --------------------------------------------------------------------------
	{ on = [ "M", "o" ], run = 'shell "organizar --all" --block', desc = "Organizar Downloads / Inbox Agora" },
	{ on = [ "M", "d" ], run = 'shell "organizar --doctor" --block', desc = "Diagnóstico do Sistema (Doctor)" },
	{ on = [ "M", "u" ], run = 'shell "bash $HOME/dotfiles/scripts/fix-pendrive.sh" --block', desc = "Destravar / Reparar Pen-drive (NTFS/FAT/exFAT)" },
	{ on = [ "M", "V" ], run = 'shell "criar-boot" --block', desc = "Cockpit Ventoy (Criar Boot / Gerenciar ISOs)" },
	{ on = [ "M", "B" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-ventoy.sh %s" --block', desc = "Enviar ISOs selecionadas para o Ventoy Multiboot" },
	{ on = [ "M", "s" ], run = 'shell "bash $HOME/dotfiles/scripts/sync-ludusavi.sh backup" --block', desc = "Backup Saves Jogos (Ludusavi)" },
	{ on = [ "M", "G" ], run = 'shell "bash $HOME/dotfiles/scripts/gdrive-mount.sh toggle" --block', desc = "Conectar / Desconectar Google Drive 5TB" },
	{ on = [ "M", "g" ], run = 'shell "lazygit" --block', desc = "Abrir Lazygit nesta Pasta" },
	{ on = [ "M", "a" ], run = 'shell "dl --dir \"$PWD\"" --block', desc = "APEX Media Cockpit (Baixar Mídia nesta Pasta)" },
	{ on = [ "M", "y" ], run = 'shell "dl --dir \"$PWD\"" --block', desc = "APEX Media Cockpit (Baixar Mídia nesta Pasta)" },
	{ on = [ "M", "t" ], run = 'shell "$TERMINAL &" --confirm', desc = "Abrir Terminal nesta Pasta" },


	# --------------------------------------------------------------------------
	# 💡 AJUDA E DIAGNÓSTICO
	# --------------------------------------------------------------------------
	{ on = "<F12>", run = 'shell "notify-send -a Yazi \"Yazi Power-User\" \"Configuração carregada com sucesso! Pressione ? para ajuda.\"" --confirm', desc = "Status / Teste Yazi" },

	# --------------------------------------------------------------------------
	# 🪄 RENOMEAR INTELIGENTE (ZERO RUÍDO VIM & PROTEÇÃO DE EXTENSÃO)
	# --------------------------------------------------------------------------
	# 'r': Limpa o nome mantendo a extensão (.mp4/.pdf) e abre com cursor no início pronto pra digitar/colar
	{ on = "r", run = "rename --empty=stem --cursor=start", desc = "Renomear (Nome limpo, mantém extensão)" },
	# 'r e': Mudar a EXTENSÃO do arquivo (.mkv -> .mp4, .txt -> .md, etc.)
	{ on = [ "r", "e" ], run = "rename --empty=all --cursor=end", desc = "Mudar Extensão / Renomear Completo" },
	# 'R': Renomear tradicional (mantém nome original com cursor antes da extensão)
	{ on = "R", run = "rename --cursor=before_ext", desc = "Renomear (Editar nome original)" },
	# 'F2': Atalho universal padrão Windows/GUI (também limpa e preserva extensão)
	{ on = "<F2>", run = "rename --empty=stem --cursor=start", desc = "Renomear (F2 Universal)" },
	# 'P' ou 'c r': Pega o título no Clipboard (wl-paste) e renomeia DIRETO preservando a extensão original!
	{ on = [ "c", "r" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-rename-smart.sh paste %s" --confirm', desc = "Colar Título do Clipboard (Preserva Extensão)" },
	{ on = [ "r", "p" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-rename-smart.sh paste %s" --confirm', desc = "Colar Título do Clipboard (Preserva Extensão)" },
	# 'r i': Prompt interativo alternativo com suporte nativo a Ctrl+V e readline
	{ on = [ "r", "i" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-rename-smart.sh prompt %s" --block', desc = "Renomear Interativo (Prompt Shell / Ctrl+V)" },

	# --------------------------------------------------------------------------
	# 📁 CRIAÇÃO DE PASTAS & ARQUIVOS (Sem atrito de digitar barra '/')
	# --------------------------------------------------------------------------
	# 'k' ou 'M k': Cria pasta direta sem precisar colocar '/' no final!
	{ on = [ "c", "k" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-mkdir.sh \"$PWD\"" --block', desc = "Criar Nova Pasta (Sem Barra)" },
	{ on = [ "m", "k" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-mkdir.sh \"$PWD\"" --block', desc = "Criar Nova Pasta (Sem Barra)" },
	{ on = "<C-n>",      run = 'shell "bash $HOME/dotfiles/scripts/yazi-mkdir.sh \"$PWD\"" --block', desc = "Criar Nova Pasta (Ctrl+N)" },
]


# ==============================================================================
# ⌨️ INPUT COMPONENT (Caixas de texto de renomear / criar arquivo)
# ==============================================================================
# Elimina ruídos do modo Vim no prompt de renomeação e adiciona atalhos universais
[input]
prepend_keymap = [
	# Cancelar imediatamente com ESC sem precisar de dois toques
	{ on = "<Esc>",   run = "close",          desc = "Cancelar renomeação" },
	{ on = "<C-c>",   run = "close",          desc = "Cancelar renomeação" },

	# Atalhos universais modernos de edição (Windows/Mac/GUI)
	{ on = "<C-v>",   run = "paste",          desc = "Colar texto do Clipboard" },
	{ on = "<C-a>",   run = "move bol",       desc = "Início da linha (Home)" },
	{ on = "<C-e>",   run = "move eol",       desc = "Fim da linha (End)" },
	{ on = "<C-u>",   run = "kill bol",       desc = "Limpar tudo para trás" },
	{ on = "<C-k>",   run = "kill eol",       desc = "Limpar tudo para frente" },
	{ on = "<C-w>",   run = "kill backward",  desc = "Apagar palavra anterior" },
	{ on = "<C-Backspace>", run = "kill backward", desc = "Apagar palavra anterior" },
	{ on = "<C-Delete>",    run = "kill forward",  desc = "Apagar palavra seguinte" },
]

