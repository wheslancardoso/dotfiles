# ==============================================================================
# 🚀 YAZI POWER-USER KEYMAP — Zero Fricção, Máxima Velocidade & Produtividade
# ==============================================================================
# Baseado na arquitetura upstream do Yazi.
# Configuração limpa com prepend_keymap para sobrepor e desbloquear atalhos.
# ==============================================================================

[mgr]
prepend_keymap = [
	# --------------------------------------------------------------------------
	# 📦 COMPRESSÃO RÁPIDA (Prefixo: 'c' de Compress)
	# --------------------------------------------------------------------------
	{ on = [ "c", "z" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-archive.sh compress-zip %s" --block', desc = "Comprimir para .ZIP (Rápido)" },
	{ on = [ "c", "7" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-archive.sh compress-7z %s" --block', desc = "Comprimir para .7Z (Ultra LZMA2)" },
	{ on = [ "c", "t" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-archive.sh compress-tar %s" --block', desc = "Comprimir para .TAR.GZ (Linux)" },
	{ on = [ "c", "c" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-archive.sh compress-custom %s" --block', desc = "Comprimir com Nome Personalizado" },

	# --------------------------------------------------------------------------
	# 📂 EXTRAÇÃO INTELIGENTE (Prefixo: 'e' de Extract ou 'X' de 1-toque)
	# --------------------------------------------------------------------------
	{ on = [ "e", "s" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-archive.sh extract-sub %s" --block', desc = "Extrair para Subpasta Limpa" },
	{ on = [ "e", "x" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-archive.sh extract-here %s" --block', desc = "Extrair Aqui" },
	{ on = "X",          run = 'shell "bash $HOME/dotfiles/scripts/yazi-archive.sh extract-sub %s" --block', desc = "Extrair para Subpasta (1 Toque)" },

	# --------------------------------------------------------------------------
	# 📋 COPIAR CAMINHOS / METADADOS (Desbloqueado e intuitivo)
	# --------------------------------------------------------------------------
	{ on = [ "c", "p" ], run = "copy path", desc = "Copiar Caminho Absoluto" },
	{ on = [ "c", "f" ], run = "copy filename", desc = "Copiar Nome do Arquivo" },
	{ on = [ "c", "d" ], run = "copy dirpath", desc = "Copiar Caminho da Pasta" },

	# --------------------------------------------------------------------------
	# 🚀 RSYNC TURBO (Transferência Segura de HDs Externos / USB)
	# --------------------------------------------------------------------------
	{ on = "R", run = 'shell "bash $HOME/dotfiles/scripts/yazi-rsync.sh %s" --block', desc = "Rsync Turbo (Transferência Segura com Barra de Progresso)" },

	# --------------------------------------------------------------------------
	# 🖱️ DRAG & DROP (Arrastar e Soltar para Navegador / Discord / Drive)
	# --------------------------------------------------------------------------
	{ on = "<C-y>", run = 'shell "ripdrag -x -i -T %s" --confirm', desc = "Arrastar arquivos para Apps/Browser (Drag & Drop)" },

	# --------------------------------------------------------------------------
	# 🔍 BUSCA FUZZY, NAVEGAÇÃO & PLUGINS DE ELITE
	# --------------------------------------------------------------------------
	{ on = "z",          run = "plugin zoxide", desc = "Pulo Rápido Inteligente (Zoxide)" },
	{ on = "Z",          run = 'shell "bash $HOME/dotfiles/scripts/yazi-fzf.sh" --block', desc = "Busca Recursiva FZF Turbo (Toggle Ocultos Ctrl+H + Previews)" },
	{ on = "<C-d>",      run = "plugin diff", desc = "Comparar Diferenças (Diff com Arquivo Selecionado)" },
	{ on = [ "c", "m" ], run = "plugin chmod", desc = "Alterar Permissões (Chmod Interativo)" },
	{ on = [ "M", "m" ], run = "plugin mount", desc = "Gerenciador de Discos / Montagem / Ejeção (Mount Manager)" },
	{ on = "l",          run = "plugin smart-enter", desc = "Entrada Inteligente (Pastas, Arquivos, Zips)" },

	# --------------------------------------------------------------------------
	# 🚀 NAVEGAÇÃO RÁPIDA CIRÚRGICA (GOTO JUMPS — Mapeamento Real /mnt/dados & $HOME)
	# --------------------------------------------------------------------------
	{ on = [ "g", "h" ], run = "cd ~", desc = "Ir para Home (~)" },
	{ on = [ "g", "d" ], run = "cd /mnt/dados/00_Inbox_Triagem", desc = "Ir para Downloads / 00_Inbox_Triagem" },
	{ on = [ "g", "i" ], run = "cd /mnt/dados/00_Inbox_Triagem", desc = "Ir para 00_Inbox_Triagem (Downloads)" },
	{ on = [ "g", "p" ], run = "cd /mnt/dados/01_Pessoal_e_Vida", desc = "Ir para 01_Pessoal_e_Vida (Documentos)" },
	{ on = [ "g", "D" ], run = "cd /mnt/dados/01_Pessoal_e_Vida", desc = "Ir para 01_Pessoal_e_Vida (Documentos)" },
	{ on = [ "g", "e" ], run = "cd /mnt/dados/02_Estudos_e_Concursos", desc = "Ir para 02_Estudos_e_Concursos" },
	{ on = [ "g", "C" ], run = "cd ~/concurso", desc = "Ir para ~/concurso (TCE-GO 2026)" },
	{ on = [ "g", "w" ], run = "cd /mnt/dados/03_Profissional_WFIX", desc = "Ir para 03_Profissional_WFIX" },
	{ on = [ "g", "v" ], run = "cd /mnt/dados/04_Desenvolvimento_e_Codigo", desc = "Ir para 04_Dev (Projetos/Git)" },
	{ on = [ "g", "x" ], run = "cd /mnt/dados/04_Desenvolvimento_e_Codigo", desc = "Ir para 04_Dev (Projetos/Git)" },
	{ on = [ "g", "m" ], run = "cd /mnt/dados/05_Design_Midia_e_Criacao", desc = "Ir para 05_Design_Midia_e_Criacao" },
	{ on = [ "g", "I" ], run = "cd /mnt/dados/05_Design_Midia_e_Criacao", desc = "Ir para Imagens (05_Design_Midia_e_Criacao)" },
	{ on = [ "g", "a" ], run = "cd /mnt/dados/05_Design_Midia_e_Criacao/05.2_Audios_e_Midias", desc = "Ir para Áudios / Músicas" },
	{ on = [ "g", "f" ], run = "cd /mnt/dados/05_Design_Midia_e_Criacao/05.4_Filmes_e_Series", desc = "Ir para Filmes / Séries / Vídeos" },
	{ on = [ "g", "V" ], run = "cd /mnt/dados/05_Design_Midia_e_Criacao/05.4_Filmes_e_Series", desc = "Ir para Vídeos (05.4_Filmes_e_Series)" },
	{ on = [ "g", "b" ], run = "cd /mnt/dados/06_Backups_ISOs_e_Sistemas", desc = "Ir para 06_Backups_ISOs_e_Sistemas" },
	{ on = [ "g", "j" ], run = "cd /mnt/dados/06_Backups_ISOs_e_Sistemas/06.4_Games_e_Emuladores", desc = "Ir para Jogos & Emuladores" },
	{ on = [ "g", "0" ], run = "cd /mnt/dados", desc = "Ir para Raiz /mnt/dados" },
	{ on = [ "g", "c" ], run = "cd ~/.config", desc = "Ir para ~/.config" },
	{ on = [ "g", "." ], run = "cd ~/dotfiles", desc = "Ir para ~/dotfiles" },
	{ on = [ "g", "G" ], run = "cd ~/gdrive", desc = "Ir para Google Drive Virtual (5 TB)" },
	{ on = [ "g", "u" ], run = "cd /run/media", desc = "Ir para Pen-drives / USB (/run/media)" },
	{ on = [ "g", "t" ], run = "cd /tmp", desc = "Ir para /tmp" },
	{ on = [ "g", "/" ], run = "cd /", desc = "Ir para Raiz do Sistema (/)" },

	# --------------------------------------------------------------------------
	# 📌 BOOKMARKS DINÂMICOS & FAVORITOS PERSISTENTES (Prefixo: 'b' ou '\'')
	# --------------------------------------------------------------------------
	{ on = [ "b", "a" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-bookmarks.sh add \"$PWD\"" --block', desc = "Favoritar Pasta Atual (Add Bookmark)" },
	{ on = [ "b", "b" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-bookmarks.sh jump" --block', desc = "Abrir Menu de Favoritos (FZF Jump)" },
	{ on = "'",          run = 'shell "bash $HOME/dotfiles/scripts/yazi-bookmarks.sh jump" --block', desc = "Abrir Favoritos (Vim Mark Jump)" },
	{ on = [ "b", "d" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-bookmarks.sh delete" --block', desc = "Remover Pasta dos Favoritos" },

	# --------------------------------------------------------------------------
	# 📅 LINEMODES & EXIBIÇÃO DE METADADOS (Prefixo: 'm' de Mode)
	# --------------------------------------------------------------------------
	{ on = [ "m", "t" ], run = "linemode mtime", desc = "Exibir Data de Modificação (mtime)" },
	{ on = [ "m", "s" ], run = "linemode size", desc = "Exibir Tamanho dos Arquivos (Padrão)" },
	{ on = [ "m", "p" ], run = "linemode permissions", desc = "Exibir Permissões Unix (rwxr-xr-x)" },
	{ on = [ "m", "o" ], run = "linemode owner", desc = "Exibir Proprietário e Grupo" },
	{ on = [ "m", "n" ], run = "linemode none", desc = "Ocultar Metadados (Modo Limpo)" },

	# --------------------------------------------------------------------------
	# 🔄 ORDENAÇÃO DINÂMICA MNEMÔNICA (Prefixo: 'o' de Order / Sort)
	# --------------------------------------------------------------------------
	{ on = [ "o", "m" ], run = "sort modified --dir-first", desc = "Ordenar por Data de Modificação (Antigos Primeiro)" },
	{ on = [ "o", "M" ], run = "sort modified --reverse --dir-first", desc = "Ordenar por Data de Modificação (Recentes Primeiro)" },
	{ on = [ "o", "s" ], run = "sort size --reverse --dir-first", desc = "Ordenar por Tamanho (Maiores Primeiro)" },
	{ on = [ "o", "S" ], run = "sort size --dir-first", desc = "Ordenar por Tamanho (Menores Primeiro)" },
	{ on = [ "o", "n" ], run = "sort alphabetical --dir-first", desc = "Ordenar por Nome (A-Z)" },
	{ on = [ "o", "a" ], run = "sort alphabetical --dir-first", desc = "Ordenar por Nome (A-Z)" },
	{ on = [ "o", "e" ], run = "sort extension --dir-first", desc = "Ordenar por Extensão / Tipo" },
	{ on = [ "o", "c" ], run = "sort created --reverse --dir-first", desc = "Ordenar por Data de Criação" },
	{ on = [ "o", "r" ], run = "sort --reverse=toggle", desc = "Inverter Ordem (Crescente / Decrescente)" },
	{ on = [ "o", "d" ], run = "sort --dir-first=toggle", desc = "Alternar Pastas no Topo" },

	# --------------------------------------------------------------------------
	# ⚡ INTEGRAÇÃO COM ORGANIZADOR MASTER & FERRAMENTAS DO SISTEMA
	# --------------------------------------------------------------------------
	{ on = [ "M", "o" ], run = 'shell "organizar --all" --block', desc = "Organizar Downloads / Inbox Agora" },
	{ on = [ "M", "d" ], run = 'shell "organizar --doctor" --block', desc = "Diagnóstico do Sistema (Doctor)" },
	{ on = [ "M", "u" ], run = 'shell "bash $HOME/dotfiles/scripts/fix-pendrive.sh" --block', desc = "Destravar / Reparar Pen-drive (NTFS/FAT/exFAT)" },
	{ on = [ "M", "V" ], run = 'shell "criar-boot" --block', desc = "Cockpit Ventoy (Criar Boot / Gerenciar ISOs)" },
	{ on = [ "M", "B" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-ventoy.sh %s" --block', desc = "Enviar ISOs selecionadas para o Ventoy Multiboot" },
	{ on = [ "M", "s" ], run = 'shell "bash $HOME/dotfiles/scripts/sync-ludusavi.sh backup" --block', desc = "Backup Saves Jogos (Ludusavi)" },
	{ on = [ "M", "G" ], run = 'shell "bash $HOME/dotfiles/scripts/gdrive-mount.sh toggle" --block', desc = "Conectar / Desconectar Google Drive 5TB" },
	{ on = [ "M", "g" ], run = 'shell "lazygit" --block', desc = "Abrir Lazygit nesta Pasta" },
	{ on = [ "M", "a" ], run = 'shell "dl --dir \"$PWD\"" --block', desc = "APEX Media Cockpit (Baixar Mídia nesta Pasta)" },
	{ on = [ "M", "y" ], run = 'shell "dl --dir \"$PWD\"" --block', desc = "APEX Media Cockpit (Baixar Mídia nesta Pasta)" },
	{ on = [ "M", "t" ], run = 'shell "$TERMINAL &" --confirm', desc = "Abrir Terminal nesta Pasta" },

	# --------------------------------------------------------------------------
	# 🏛️ AÇÕES DE ELITE (OCR, AirDrop Web, Hashes, Clipboard & Mídia)
	# --------------------------------------------------------------------------
	{ on = "O",          run = 'shell "bash $HOME/dotfiles/scripts/yazi-actions.sh ocr %s" --block', desc = "OCR Forense (Tesseract -> Clipboard)" },
	{ on = [ "M", "w" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-actions.sh qr-share \"$PWD\"" --block', desc = "AirDrop Web Local + QR Code" },
	{ on = [ "c", "s" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-actions.sh sha256 %s" --block', desc = "Calcular SHA-256 (Copia Hash)" },
	{ on = [ "y", "c" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-actions.sh copy-content %s" --confirm', desc = "Copiar Conteúdo de Texto pro Clipboard" },
	{ on = [ "y", "i" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-actions.sh copy-image %s" --confirm', desc = "Copiar Imagem Bitmap pro Clipboard" },
	{ on = [ "d", "u" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-actions.sh disk-usage \"$PWD\"" --block', desc = "Raio-X de Uso de Disco (GDU)" },
	{ on = [ "u", "t" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-actions.sh trash-restore" --block', desc = "Restaurar da Lixeira (trash-restore)" },
	{ on = [ "M", "M", "w" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-actions.sh media-webp %s" --confirm', desc = "Converter Imagem para WebP" },
	{ on = [ "M", "M", "a" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-actions.sh media-mp3 %s" --confirm', desc = "Extrair Áudio para MP3" },
	{ on = [ "M", "M", "g" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-actions.sh media-gif %s" --confirm', desc = "Gerar GIF Otimizado" },


	# --------------------------------------------------------------------------
	# 💡 AJUDA E DIAGNÓSTICO
	# --------------------------------------------------------------------------
	{ on = "<F12>", run = 'shell "notify-send -a Yazi \"Yazi Power-User\" \"Configuração carregada com sucesso! Pressione ? para ajuda.\"" --confirm', desc = "Status / Teste Yazi" },

	# --------------------------------------------------------------------------
	# 🪄 RENOMEAR INTELIGENTE (ZERO RUÍDO VIM & PROTEÇÃO DE EXTENSÃO)
	# --------------------------------------------------------------------------
	# 'r': Mantém o nome original com cursor antes da extensão pronto pra editar
	{ on = "r", run = "rename --cursor=before_ext", desc = "Renomear (Mantém nome original, cursor antes da extensão)" },
	# 'r e': Mudar a EXTENSÃO do arquivo (.mkv -> .mp4, .txt -> .md, etc.)
	{ on = [ "r", "e" ], run = "rename --empty=all --cursor=end", desc = "Mudar Extensão / Renomear Completo" },
	# 'R': Renomear do zero (limpa o nome mantendo a extensão)
	{ on = "R", run = "rename --empty=stem --cursor=start", desc = "Renomear (Limpa nome, mantém extensão)" },
	# 'F2': Atalho universal padrão Windows/GUI (também mantém nome original)
	{ on = "<F2>", run = "rename --cursor=before_ext", desc = "Renomear (F2 Universal - Mantém nome)" },
	# 'P' ou 'c r': Pega o título no Clipboard (wl-paste) e renomeia DIRETO preservando a extensão original!
	{ on = [ "c", "r" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-rename-smart.sh paste %s" --confirm', desc = "Colar Título do Clipboard (Preserva Extensão)" },
	{ on = [ "r", "p" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-rename-smart.sh paste %s" --confirm', desc = "Colar Título do Clipboard (Preserva Extensão)" },
	# 'r i': Prompt interativo alternativo com suporte nativo a Ctrl+V e readline
	{ on = [ "r", "i" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-rename-smart.sh prompt %s" --block', desc = "Renomear Interativo (Prompt Shell / Ctrl+V)" },

	# --------------------------------------------------------------------------
	# 📁 CRIAÇÃO DE PASTAS & ARQUIVOS (Sem atrito de digitar barra '/')
	# --------------------------------------------------------------------------
	# 'k' ou 'M k': Cria pasta direta sem precisar colocar '/' no final!
	{ on = [ "c", "k" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-mkdir.sh \"$PWD\"" --block', desc = "Criar Nova Pasta (Sem Barra)" },
	{ on = [ "m", "k" ], run = 'shell "bash $HOME/dotfiles/scripts/yazi-mkdir.sh \"$PWD\"" --block', desc = "Criar Nova Pasta (Sem Barra)" },
	{ on = "<C-n>",      run = 'shell "bash $HOME/dotfiles/scripts/yazi-mkdir.sh \"$PWD\"" --block', desc = "Criar Nova Pasta (Ctrl+N)" },

	# --------------------------------------------------------------------------
	# ↩️ DESFAZER INTELIGENTE (UNDO RENOMEAÇÃO COM 'u' OU 'Ctrl+Z')
	# --------------------------------------------------------------------------
	{ on = "u",     run = 'shell "bash $HOME/dotfiles/scripts/yazi-undo.sh" --confirm', desc = "Desfazer Última Renomeação (Undo)" },
	{ on = "<C-z>", run = 'shell "bash $HOME/dotfiles/scripts/yazi-undo.sh" --confirm', desc = "Desfazer Última Renomeação (Ctrl+Z)" },
]



# ==============================================================================
# ⌨️ INPUT COMPONENT (Caixas de texto de renomear / criar arquivo)
# ==============================================================================
# Elimina ruídos do modo Vim no prompt de renomeação e adiciona atalhos universais
[input]
prepend_keymap = [
	# Cancelar imediatamente com ESC sem precisar de dois toques
	{ on = "<Esc>",   run = "close",          desc = "Cancelar renomeação" },
	{ on = "<C-c>",   run = "close",          desc = "Cancelar renomeação" },

	# Atalhos universais modernos de edição (Windows/Mac/GUI)
	{ on = "<C-v>",   run = "paste",          desc = "Colar texto do Clipboard" },
	{ on = "<C-a>",   run = "move bol",       desc = "Início da linha (Home)" },
	{ on = "<C-e>",   run = "move eol",       desc = "Fim da linha (End)" },
	{ on = "<C-u>",   run = "kill bol",       desc = "Limpar tudo para trás" },
	{ on = "<C-k>",   run = "kill eol",       desc = "Limpar tudo para frente" },
	{ on = "<C-w>",   run = "kill backward",  desc = "Apagar palavra anterior" },
	{ on = "<C-Backspace>", run = "kill backward", desc = "Apagar palavra anterior" },
	{ on = "<C-Delete>",    run = "kill forward",  desc = "Apagar palavra seguinte" },
]

