[manager]
ratio          = [ 1, 4, 3 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = true
show_symlink   = true

[preview]
tab_size        = 2
max_width       = 600
max_height      = 900
cache_dir       = ""
image_filter    = "triangle"
image_quality   = 75
sixel_fraction  = 15
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
open = [
	{ run = 'xdg-open "$@"', desc = "Abrir com App Padrão" },
]
edit = [
	{ run = '${EDITOR:-vi} "$@"', block = true, desc = "Editar" },
]
image = [
	{ run = 'imv "$@"', orphan = true, desc = "IMV (Visualizador Rápido Wayland)" },
	{ run = 'xdg-open "$@"', orphan = true, desc = "Abrir com App Padrão (Loupe)" },
]
markdown = [
	{ run = 'glow -p "$@"', block = true, desc = "Glow (Leitor Estilizado no Terminal)" },
	{ run = '${EDITOR:-nvim} "$@"', block = true, desc = "Editar no Neovim" },
	{ run = 'xdg-open "$@"', orphan = true, desc = "Abrir com App Padrão" },
]
pdf = [
	{ run = 'zathura "$@"', orphan = true, desc = "Zathura (Vim PDF Rápido)" },
	{ run = 'okular "$@"', orphan = true, desc = "Okular (PDF & Anotações)" },
]
video = [
	{ run = 'celluloid "$@"', orphan = true, desc = "Celluloid (Player Moderno)" },
	{ run = 'mpv "$@"', orphan = true, desc = "MPV (Aceleração GPU NVDEC)" },
	{ run = 'mpv --vo=kitty "$@"', block = true, desc = "Assistir Dentro do Terminal (Kitty VO)" },
]
office = [
	{ run = 'onlyoffice-desktopeditors "$@"', orphan = true, desc = "OnlyOffice" },
]
share = [
	{ run = 'localsend "$@" &', orphan = true, desc = "Enviar via LocalSend (AirDrop Celular/PC)" },
]
archive = [
	{ run = 'bash "$HOME/dotfiles/scripts/yazi-archive.sh" extract-sub %s', block = true, desc = "Extrair para Subpasta (Limpo)" },
	{ run = 'bash "$HOME/dotfiles/scripts/yazi-archive.sh" extract-here %s', block = true, desc = "Extrair Aqui" },
	{ run = 'xdg-open %s1', orphan = true, desc = "Abrir com Gerenciador Padrão" },
]

[open]
rules = [
	{ mime = "inode/directory", use = [ "open", "edit" ] },
	{ name = "*.md", use = [ "markdown", "edit", "open" ] },
	{ mime = "text/*", use = [ "edit", "open" ] },
	{ mime = "image/*", use = [ "image", "open" ] },
	{ mime = "video/*", use = [ "video", "open" ] },
	{ mime = "audio/*", use = [ "video", "open" ] },
	{ mime = "application/pdf", use = [ "pdf", "open" ] },
	{ mime = "application/vnd.openxmlformats-officedocument.*", use = [ "office", "open" ] },
	{ mime = "application/msword", use = [ "office", "open" ] },
	{ mime = "application/vnd.ms-*", use = [ "office", "open" ] },
	# Suporte Completo a Arquivos Comprimidos / Compactados
	{ mime = "application/*zip", use = [ "archive", "open" ] },
	{ mime = "application/x-tar", use = [ "archive", "open" ] },
	{ mime = "application/x-bzip*", use = [ "archive", "open" ] },
	{ mime = "application/x-7z-compressed", use = [ "archive", "open" ] },
	{ mime = "application/x-rar*", use = [ "archive", "open" ] },
	{ mime = "application/x-xz", use = [ "archive", "open" ] },
	{ mime = "application/gzip", use = [ "archive", "open" ] },
	{ mime = "application/zstd", use = [ "archive", "open" ] },
	{ name = "*.{zip,rar,7z,tar,tar.gz,tgz,tar.bz2,tbz2,tar.xz,txz,gz,xz,zst,apk,iso}", use = [ "archive", "open" ] },
]


[flavor]
use = "catppuccin-mocha"
