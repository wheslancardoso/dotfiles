[manager]
ratio          = [ 1, 4, 3 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = true
show_symlink   = true

[preview]
tab_size        = 2
max_width       = 1200
max_height      = 1500
cache_dir       = ""
image_filter    = "triangle"
image_quality   = 85
sixel_fraction  = 15
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[tasks]
micro_workers = 16
macro_workers = 32
bizarre_retry = 5


[opener]
open = [
	{ run = 'xdg-open %s1', desc = "Abrir com App Padrão", orphan = true },
]
edit = [
	{ run = '${EDITOR:-nvim} %s', block = true, desc = "Editar no Neovim" },
]
image = [
	{ run = 'imv %s', orphan = true, desc = "IMV (Visualizador Rápido Wayland)" },
	{ run = 'xdg-open %s1', orphan = true, desc = "Abrir com App Padrão (Loupe)" },
]
markdown = [
	{ run = 'glow -p %s', block = true, desc = "Glow (Leitor Estilizado no Terminal)" },
	{ run = '${EDITOR:-nvim} %s', block = true, desc = "Editar no Neovim" },
	{ run = 'xdg-open %s1', orphan = true, desc = "Abrir com App Padrão" },
]
pdf = [
	{ run = 'zathura %s', orphan = true, desc = "Zathura (Vim PDF Rápido)" },
	{ run = 'okular %s', orphan = true, desc = "Okular (PDF & Anotações)" },
]
video = [
	{ run = 'celluloid %s', orphan = true, desc = "Celluloid (Player Moderno)" },
	{ run = 'mpv %s', orphan = true, desc = "MPV (Aceleração GPU NVDEC)" },
	{ run = 'mpv --vo=kitty %s', block = true, desc = "Assistir Dentro do Terminal (Kitty VO)" },
]
office = [
	{ run = 'onlyoffice-desktopeditors %s', orphan = true, desc = "OnlyOffice" },
]
share = [
	{ run = 'localsend %s &', orphan = true, desc = "Enviar via LocalSend (AirDrop Celular/PC)" },
]
archive = [
	{ run = 'bash "$HOME/dotfiles/scripts/yazi-archive.sh" extract-sub %s', block = true, desc = "Extrair para Subpasta (Limpo)" },
	{ run = 'bash "$HOME/dotfiles/scripts/yazi-archive.sh" extract-here %s', block = true, desc = "Extrair Aqui" },
	{ run = 'xdg-open %s1', orphan = true, desc = "Abrir com Gerenciador Padrão" },
]
html = [
	{ run = 'brave %s', orphan = true, desc = "Brave Browser" },
	{ run = '${EDITOR:-nvim} %s', block = true, desc = "Editar no Neovim" },
	{ run = 'xdg-open %s1', orphan = true, desc = "Abrir com Navegador Padrão" },
]

[open]
rules = [
	{ mime = "inode/directory", use = [ "open", "edit" ] },
	{ mime = "text/markdown", use = [ "markdown", "edit", "open" ] },
	{ url = "*.md", use = [ "markdown", "edit", "open" ] },
	{ url = "**/*.md", use = [ "markdown", "edit", "open" ] },
	{ mime = "text/html", use = [ "html", "edit", "open" ] },
	{ url = "*.{html,htm}", use = [ "html", "edit", "open" ] },
	{ url = "**/*.{html,htm}", use = [ "html", "edit", "open" ] },
	{ mime = "text/*", use = [ "edit", "open" ] },
	{ mime = "image/*", use = [ "image", "open" ] },
	{ mime = "video/*", use = [ "video", "open" ] },
	{ mime = "audio/*", use = [ "video", "open" ] },
	{ mime = "application/pdf", use = [ "pdf", "open" ] },
	{ mime = "application/vnd.openxmlformats-officedocument.*", use = [ "office", "open" ] },
	{ mime = "application/msword", use = [ "office", "open" ] },
	{ mime = "application/vnd.ms-*", use = [ "office", "open" ] },
	# Suporte Completo a Arquivos Comprimidos / Compactados
	{ mime = "application/*zip", use = [ "archive", "open" ] },
	{ mime = "application/x-tar", use = [ "archive", "open" ] },
	{ mime = "application/x-bzip*", use = [ "archive", "open" ] },
	{ mime = "application/x-7z-compressed", use = [ "archive", "open" ] },
	{ mime = "application/x-rar*", use = [ "archive", "open" ] },
	{ mime = "application/x-xz", use = [ "archive", "open" ] },
	{ mime = "application/gzip", use = [ "archive", "open" ] },
	{ mime = "application/zstd", use = [ "archive", "open" ] },
	{ url = "*.{zip,rar,7z,tar,tar.gz,tgz,tar.bz2,tbz2,tar.xz,txz,gz,xz,zst,apk,iso}", use = [ "archive", "open" ] },
	{ url = "**/*.{zip,rar,7z,tar,tar.gz,tgz,tar.bz2,tbz2,tar.xz,txz,gz,xz,zst,apk,iso}", use = [ "archive", "open" ] },
]

[plugin]
prepend_fetchers = [
	{ id = "git", url = "*", run = "git", prio = "normal", group = "git" },
	{ id = "git", url = "*/", run = "git", prio = "normal", group = "git" },
]
prepend_previewers = [
	# 📝 Preview de Markdown Renderizado no Estilo Glow Catppuccin
	{ url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
	# 🌐 Preview de HTML Renderizado via w3m
	{ url = "*.{html,htm}", run = 'piper -- w3m -dump -T text/html -cols $w "$1"' },
]

