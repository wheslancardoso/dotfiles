# ==============================================================================
# 🎧 WIREPLUMBER BLUETOOTH AUDIOPHILE CODECS (LDAC 990k, AptX-HD, AAC, SBC-XQ)
# ==============================================================================
# Habilita transmissão wireless de alta fidelidade sem compressão destrutiva:
# - LDAC em 990 kbps (24-bit / 96kHz High-Res nativo para fones Sony/Audiófilos)
# - AptX-HD e AptX
# - AAC (Qualidade Apple)
# - SBC-XQ Dual Channel (Qualidade superior ao aptX padrão em fones comuns)
# ==============================================================================

monitor.bluez.properties = {
  bluez5.enable-sbc-xq   = true
  bluez5.enable-msbc     = true
  bluez5.enable-hw-volume = true
  bluez5.codecs          = [ "ldac" "aptx_hd" "aptx" "aac" "sbc_xq" "sbc" "opus" ]
}
