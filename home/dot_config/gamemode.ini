; 🎮 Configuração de Alta Performance do GameMode (Feral Interactive)
; Ajusta CPU, I/O e GPU NVIDIA RTX para desempenho máximo em jogos e emuladores

[general]
renice = 10
ioprio = 0
inhibit_screensaver = 1

[gpu]
apply_gpu_optimisations = 1
gpu_device = 0
nv_powermode_prefer_max_perf = 1

[cpu]
park_cores = 0
pin_cores = 0

[custom]
start = notify-send -t 4000 -i input-gaming "🎮 GameMode Ativado" "Otimizações de CPU e GPU RTX engajadas!"
end = notify-send -t 3000 -i input-gaming "GameMode Desativado" "Retornando ao perfil balanceado."
