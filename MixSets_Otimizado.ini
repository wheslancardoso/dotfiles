# ==============================================================================
# MixSets.ini - Perfil Supremo de Otimização Visual, Câmera e Zero-Atrito
# Configurado para: GTA San Andreas v1.0 US (MixSets v4+ por Junior_Djjr)
# Coloque este arquivo dentro de: modloader/01_Correcoes_Codigo/MixSets/
# ==============================================================================

[Graphics]
; --- Remoção de Desfoques e Distorções Irritantes ---
DisableMoBlur = 1             ; Desativa o Motion Blur (desfoque de movimento em alta velocidade)
DisaNitroBlur = 1             ; Desativa o efeito de tela borrada e túnel ao ativar o Nitro (NOS)
DisableHeat = 1               ; Desativa a distorção térmica / ondulação de calor no deserto e cidades
DisableFovChange = 1          ; Impede a câmera de distorcer o FOV / ângulo de visão ao acelerar
VehiclesHighSpeedFOV = 0      ; Remove o zoom falso de "sensação de velocidade" esticada
EnhancedDistance = 1.5        ; Aumenta a distância de renderização de modelos e detalhes

[Camera]
; --- Câmera Livre e Conforto ao Dirigir/Voar ---
NoMouseCentering = 1          ; Desativa o auto-center da câmera (o mouse fica 100% livre ao dirigir e pilotar)
VehicleCamDistance = 1.25     ; Afasta levemente a câmera do carro e do avião para visão ampla
VehiclesAirRoll = 1           ; Permite usar as teclas de direção para desvirar o carro no ar

[Vehicles]
; --- Fim das Frustrações com Carros e Direção ---
NoCarFlipFire = 1             ; Carros de cabeça para baixo NUNCA entram em combustão automática
BrakePower = 1.25             ; Aumenta a eficiência e precisão da frenagem dos veículos
CarsSteeringAngleHighSpeed = 0.6 ; Reduz esterçamento agressivo em alta velocidade (não roda na rodovia)
NoHydraThrustReset = 1        ; Impede que o bocal dos jatos do Hydra perca impulso sozinho
PlanesPitchSensitivity = 0.8  ; Sensibilidade equilibrada para bicar/subir com aeronaves no mouse
RadioAutoTune = 0             ; O rádio não muda de estação sozinho ao entrar em novos veículos

[Weapons]
; --- Inventário Permanente e Proteção de Arsenal ---
KeepWeaponsAfterWasted = 1    ; Não perde nenhuma arma ao morrer (Wasted)
KeepWeaponsAfterBusted = 1    ; Não perde nenhuma arma ao ser preso (Busted)
NoWeaponDropOnPickup = 1      ; Não joga a arma atual fora ao passar em cima de outra do mesmo slot

[Player]
; --- Fim dos Atritos do CJ ---
SprintInInteriors = 1         ; Permite correr / sprintar no máximo dentro de cassinos, lojas e casas
NoMuscleDecay = 1             ; O CJ nunca perde massa muscular por falta de academia
NoFatDecay = 1                ; O CJ nunca perde nem acumula gordura passivamente
NoSprintExhaust = 0           ; Mantém stamina realista (mude para 1 se quiser corrida infinita sem cansar)

[Gameplay]
; --- Qualidade de Vida e Missões ---
NoGangAttacks = 1             ; Desativa os ataques aleatórios e chatos a territórios de gangue em Los Santos
FastLoading = 1               ; Pula telas de intro e logos da Rockstar, abrindo direto no jogo
InfiniteRCPlaneFuel = 1       ; Combustível infinito para aviões de controle remoto (Missões do Zero)
